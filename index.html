<!DOCTYPE html>
<html lang="zh-Hant" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<title>種子的世界</title>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#E6EDDC;--paper:#FAFCF5;--ink:#25311E;--muted:#5D6A53;--line:#CBD5BD;
  --soilTop:#9B6B45;--soil:#7A5236;--soil2:#5C3D27;--grass:#9DC27B;--grass2:#7FA660;--grass3:#6A8F4E;
  --leaf:#3F7B38;--mustard:#D8A42C;--water:#3F86C4;--danger:#B4452F;--chip:#EDF2E4;--accent:#3F7B38;--onAccent:#FFFFFF;
  color-scheme:light;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1A2016;--paper:#232B1E;--ink:#E5ECDA;--muted:#A3AF94;--line:#3A4632;
    --soilTop:#80583A;--soil:#664530;--soil2:#4B3222;--grass:#5E7D46;--grass2:#4C6738;--grass3:#3E552E;
    --leaf:#78B866;--mustard:#E6B84D;--water:#6AA8DE;--danger:#E58069;--chip:#2D3727;--accent:#78B866;--onAccent:#14200F;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#1A2016;--paper:#232B1E;--ink:#E5ECDA;--muted:#A3AF94;--line:#3A4632;
  --soilTop:#80583A;--soil:#664530;--soil2:#4B3222;--grass:#5E7D46;--grass2:#4C6738;--grass3:#3E552E;
  --leaf:#78B866;--mustard:#E6B84D;--water:#6AA8DE;--danger:#E58069;--chip:#2D3727;--accent:#78B866;--onAccent:#14200F;
  color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;font-size:16px;line-height:1.6;-webkit-tap-highlight-color:transparent}
main{max-width:480px;margin:0 auto;padding:16px 16px 110px}
header{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:8px}
h1{font-family:"Noto Serif TC","Songti TC",serif;font-size:26px;line-height:1.2;margin:0;letter-spacing:.04em}
.sub{font-size:13px;color:var(--muted);margin:2px 0 0}
.coins{display:flex;align-items:center;gap:6px;background:var(--paper);border:1px solid var(--line);border-radius:999px;padding:4px 12px 4px 6px;font-weight:500;white-space:nowrap}
.coin{width:20px;height:20px;border-radius:50%;background:var(--mustard);box-shadow:inset 0 0 0 3px rgba(255,255,255,.35)}
#farm{width:100%;height:auto;display:block;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.tools{display:flex;gap:12px;justify-content:center;margin:10px 0 4px}
.tool{display:flex;flex-direction:column;align-items:center;gap:2px;background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:6px 16px;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;cursor:grab;font-size:13px}
#ghost{position:fixed;left:0;top:0;pointer-events:none;z-index:50;display:none;transform:translate(-50%,-115%);text-align:center}
#ghost .gl{display:block;background:var(--ink);color:var(--paper);font-size:12px;border-radius:999px;padding:2px 8px;white-space:nowrap;margin-top:2px}
.mini{border:1px solid var(--line);background:var(--chip);border-radius:8px;padding:0 8px;font-size:13px;margin-left:4px;vertical-align:middle}
.rename{display:flex;gap:4px;align-items:center;flex-wrap:wrap}
.rename input{font:inherit;width:8.5em;padding:4px 8px;border:1px solid var(--line);border-radius:8px;background:var(--paper);color:var(--ink)}
.err{color:var(--danger);font-size:13px}
#farm [data-plot]{cursor:pointer}
.hint{text-align:center;color:var(--muted);font-size:14px;margin:4px 0 0;min-height:22px}
h2{font-family:"Noto Serif TC","Songti TC",serif;font-size:20px;margin:8px 0 12px}
.lot{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:12px}
.lot-top{display:flex;gap:12px;align-items:center}
.lot-name{font-weight:700;font-size:17px}
.meta{font-size:13px;color:var(--muted)}
.sims{display:flex;gap:4px;align-items:center;margin-top:8px;flex-wrap:wrap}
.sims .lbl{font-size:12px;color:var(--muted);width:100%}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--paper);border-top:1px solid var(--line);display:flex;justify-content:center;gap:8px;padding:8px 16px calc(8px + env(safe-area-inset-bottom,0px));z-index:20}
nav button{flex:1;max-width:220px;border:0;background:transparent;color:var(--muted);font:inherit;font-weight:500;padding:8px;border-radius:10px}
nav button[aria-current="page"]{background:var(--chip);color:var(--ink)}
button{font:inherit;color:inherit}
.btn{display:block;width:100%;border:1px solid var(--line);background:var(--paper);border-radius:12px;padding:12px;font-weight:500;margin-top:8px;text-align:center}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--onAccent)}
.btn.warn{color:var(--danger)}
.btn:disabled{opacity:.5}
.btn:focus-visible,nav button:focus-visible{outline:3px solid var(--mustard);outline-offset:2px}
.row2{display:flex;gap:8px}.row2 .btn{flex:1}
#backdrop{position:fixed;inset:0;background:rgba(10,20,5,.45);display:none;z-index:30}
#sheet{position:fixed;left:0;right:0;bottom:0;max-height:86vh;overflow-y:auto;background:var(--paper);border-radius:20px 20px 0 0;padding:8px 18px calc(18px + env(safe-area-inset-bottom,0px));z-index:31;transform:translateY(105%);transition:transform .22s ease}
#sheet.open{transform:none}
@media (prefers-reduced-motion: reduce){#sheet{transition:none}}
.grip{width:40px;height:4px;border-radius:2px;background:var(--line);margin:4px auto 10px}
.sheet-wrap{max-width:480px;margin:0 auto}
.stage{font-size:13px;color:var(--muted)}
.bar{height:10px;background:var(--chip);border-radius:6px;overflow:hidden;margin:6px 0}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:6px}
.stat{display:grid;grid-template-columns:5.5em 1fr 3.4em;gap:8px;align-items:center;font-size:14px;margin:4px 0}
.stat .v{text-align:right;font-weight:500;font-variant-numeric:tabular-nums}
.stat .bar{margin:0}
.chips{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:6px 0 10px}
.chip{background:var(--chip);border-radius:999px;padding:2px 10px;font-size:13px}
.scores{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.score{background:var(--chip);border-radius:12px;padding:8px;text-align:center}
.score b{display:block;font-size:20px;font-variant-numeric:tabular-nums}
.score span{font-size:12px;color:var(--muted)}
.badges{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.badge{font-size:13px;border:1px solid var(--line);border-radius:999px;padding:1px 10px}
.badge.r1{border-color:#5E9BC8}.badge.r2{border-color:#9B6CC8}.badge.r3{border-color:var(--mustard);font-weight:700}.badge.r4{border-color:#E0823D;background:#FFF1DE;font-weight:700}.badge.r5{border-color:#C2558F;background:linear-gradient(90deg,#FFE3EE,#E3F0FF);font-weight:700}
.silh svg{filter:brightness(0);opacity:.35}
.dexq{display:flex;gap:6px;margin:4px 0}.dexq input{flex:1;min-width:0}
.vq{display:grid;grid-template-columns:1fr 1fr;gap:6px 10px;margin:6px 0}.vq label{display:flex;flex-direction:column;font-size:13px;color:#5A3416}.vq select,.vq input{font-size:15px;min-width:0}
.vres .meta{display:block;margin:-4px 0 8px 8px}
.avdirs{display:flex;justify-content:center;gap:2px;margin:-4px 0 6px}
.seedic{position:relative;display:inline-flex;flex:none}.seedic i{position:absolute;left:50%;bottom:-2px;transform:translateX(-50%);white-space:nowrap;font-style:normal;font-size:10px;background:#FFF6DE;border:1px solid #E2C796;border-radius:8px;padding:0 4px;color:#5A3416}
.dist{border:2px solid #E2C796;border-radius:12px;background:#FFFDF6;padding:6px 10px;margin:8px 0}.dist summary{font-weight:700;color:#5A3416;cursor:pointer}
.prow{display:flex;align-items:center;gap:8px;padding:3px 0;border-top:1px dashed #EAD9B4}.prow .pl{flex:1;display:flex;flex-direction:column;font-size:14px;line-height:1.3}.prow .pp{font-weight:700;color:#5A3416;font-size:14px}
.hero{display:flex;justify-content:center}
.pick{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:1px solid var(--line);background:var(--paper);border-radius:12px;padding:8px 10px;margin-top:8px}
.pick .meta{display:block}
.note{font-size:13px;color:var(--muted)}
#toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:8px 16px;border-radius:999px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:40;max-width:90vw;text-align:center}
#toast.show{opacity:1}
.settings{margin-top:24px;border-top:1px solid var(--line);padding-top:12px}
#login{position:fixed;inset:0;background:var(--bg);z-index:60;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center}
#login[hidden]{display:none}
#login h1{font-size:34px;margin-bottom:6px}
#login .btn{max-width:320px}
.sync{font-size:12px;color:var(--muted);text-align:right;margin-top:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

.filters{display:flex;gap:6px;overflow-x:auto;padding:2px 0 10px;-webkit-overflow-scrolling:touch}
.fchip{border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:4px 12px;white-space:nowrap;font-size:14px;flex:none}
.fchip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--onAccent)}
h3{font-family:"Noto Serif TC","Songti TC",serif;font-size:17px;margin:16px 0 8px}
.sellbox label{display:block;font-size:14px;margin-top:8px}
.sellbox input,.regbox input{display:block;width:100%;font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--paper);color:var(--ink);margin-top:4px}
.regbox{background:var(--chip);border-radius:12px;padding:10px 12px;margin:12px 0}
nav button{padding:8px 2px;font-size:15px}
#farmWrap,.farmWrap{overflow-x:auto;overflow-y:hidden;border-radius:16px;-webkit-overflow-scrolling:touch}
#farmWrap{touch-action:none}
.farmWrap.v{touch-action:pan-x}
#farm,.farmsvg{width:322%;max-width:none;height:auto;display:block}
.modes{display:flex;gap:6px;margin:4px 0 8px;align-items:center}
.modes .fchip{font-size:14px}
.modes .sp{flex:1}
#farmBox{position:relative}
#joy{position:absolute;left:10px;bottom:10px;width:104px;height:104px;border-radius:50%;background:rgba(255,255,255,.35);border:2px solid rgba(0,0,0,.15);touch-action:none;z-index:5}
#joyKnob{position:absolute;left:50%;top:50%;width:44px;height:44px;margin:-22px 0 0 -22px;border-radius:50%;background:var(--paper);border:2px solid var(--line);box-shadow:0 2px 6px rgba(0,0,0,.2);pointer-events:none}
#actBtn{position:absolute;right:12px;bottom:22px;width:78px;height:78px;border-radius:50%;border:0;background:var(--accent);color:var(--onAccent);font-weight:700;font-size:16px;z-index:5;box-shadow:0 2px 6px rgba(0,0,0,.2)}
#visitBar{display:flex;align-items:center;gap:8px;background:var(--chip);border-radius:12px;padding:6px 10px;margin-bottom:8px;font-size:14px}
#visitBar[hidden]{display:none}
#visitBar span{flex:1}
.decorItems{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px}
.ditem{flex:none;display:flex;flex-direction:column;align-items:center;font-size:12px;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:4px 6px;width:70px}
.ditem[aria-pressed="true"]{border:2px solid var(--mustard)}
.avrow{display:grid;grid-template-columns:5.5em 1fr;align-items:center;gap:6px;margin:6px 0}
.avrow b{text-align:center;font-weight:500}
.avrow:has(b){grid-template-columns:5.5em auto 1fr auto}
.sw{display:flex;flex-wrap:wrap;gap:6px}
.swatch{width:28px;height:28px;border-radius:50%;border:2px solid var(--line)}
.swatch[aria-pressed="true"]{border:3px solid var(--ink)}
#tut{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(70px + env(safe-area-inset-bottom,0px));width:min(460px,calc(100vw - 24px));background:var(--paper);border:2px solid var(--mustard);border-radius:16px;padding:10px 12px;z-index:25;box-shadow:0 4px 14px rgba(0,0,0,.18)}
#tut[hidden]{display:none}
.tuth{display:flex;align-items:center;gap:8px;font-weight:700}
.tuth .gp{width:44px;height:44px;border-radius:50%;border:2px solid #5A3416;background:#fff;flex:none}
.tuth .stp{margin-left:auto;font-size:12px;color:var(--muted);font-weight:400}
#tutText{margin:6px 0;font-size:15px}
.tutb{display:flex;gap:8px;justify-content:flex-end}
.tutb button{font:inherit;font-size:14px;border-radius:10px;padding:6px 12px;border:1px solid var(--line);background:var(--paper);color:var(--ink)}
#tutNext{background:var(--accent);color:var(--onAccent);border-color:var(--accent)}
.tool{font:inherit;font-size:13px;color:var(--ink)}
.bagtools{display:flex;gap:8px;align-items:flex-start}
.bagtools .filters{flex:1;min-width:0}
.sortl{font-size:13px;color:var(--muted);white-space:nowrap;display:flex;flex-direction:column}
.sortl select{font:inherit;font-size:14px;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:4px 6px}
.lotrow{display:flex;gap:10px;align-items:center;width:100%;text-align:left;background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:8px 10px;margin-bottom:8px}
.lr{display:flex;flex-direction:column;min-width:0}
.friend{display:flex;align-items:center;gap:6px;padding:8px 0;border-bottom:1px solid var(--line)}
.friend b{flex:1}
#chat,.chatbox{max-height:50vh;overflow-y:auto;background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:8px}
.msg{margin:6px 0;padding:6px 10px;background:var(--chip);border-radius:12px;max-width:85%;width:fit-content;word-break:break-word}
.msg.me{margin-left:auto;background:var(--accent);color:var(--onAccent)}
.msg .who{display:block;font-size:12px;opacity:.75}
.chatbar{display:flex;gap:6px;margin-top:8px}
.chatbar input{flex:1;font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--paper);color:var(--ink);min-width:0}
.mini.big{padding:6px 14px;font-size:15px}

body.game{overflow:hidden;position:fixed;inset:0;touch-action:none;overscroll-behavior:none}
#scene{position:fixed;inset:0;width:100vw;height:100vh;height:100dvh;display:block;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.hudTop{position:fixed;left:10px;top:calc(8px + env(safe-area-inset-top,0px));z-index:10;display:flex;flex-direction:column;gap:4px;align-items:flex-start;pointer-events:none}
.sceneName{background:var(--paper);border:1px solid var(--line);border-radius:999px;padding:2px 12px;font-size:13px;font-weight:500}
.hudTop .sync{text-align:left;background:var(--paper);border-radius:8px;padding:0 6px;opacity:.9}
.hudTop .sync:empty{display:none}
#iconbar{position:fixed;right:8px;top:calc(8px + env(safe-area-inset-top,0px));z-index:10;display:flex;flex-direction:column;gap:6px}
#iconbar button{width:54px;height:52px;border-radius:14px;border:1px solid var(--line);background:var(--paper);color:var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;font:inherit;font-size:11px;line-height:1.2;position:relative;padding:2px;box-shadow:0 1px 4px rgba(0,0,0,.14)}
#iconbar button[hidden]{display:none}
#iconbar svg{width:24px;height:24px;margin-bottom:1px}
#ordersBadge{position:absolute;top:-5px;right:-5px;background:var(--danger);color:#fff;border-radius:999px;font-style:normal;font-size:11px;min-width:18px;height:18px;line-height:18px;text-align:center}
#ordersBadge[hidden]{display:none}
#joy{position:fixed;left:18px;bottom:calc(24px + env(safe-area-inset-bottom,0px));width:124px;height:124px;border-radius:50%;background:rgba(255,255,255,.35);border:2px solid rgba(0,0,0,.18);touch-action:none;z-index:10}
#joyKnob{position:absolute;left:50%;top:50%;width:50px;height:50px;margin:-25px 0 0 -25px;border-radius:50%;background:var(--paper);border:2px solid var(--line);box-shadow:0 2px 6px rgba(0,0,0,.22);pointer-events:none}
#actBtn{position:fixed;right:20px;bottom:calc(30px + env(safe-area-inset-bottom,0px));width:92px;height:92px;border-radius:50%;border:0;background:var(--accent);color:var(--onAccent);font:inherit;font-weight:700;font-size:18px;z-index:10;box-shadow:0 3px 8px rgba(0,0,0,.25);touch-action:manipulation}
#actBtn.off{opacity:.55}
.sbtn{position:fixed;width:60px;height:60px;border-radius:50%;border:1px solid var(--line);background:var(--paper);color:var(--ink);font:inherit;font-size:13px;font-weight:500;z-index:10;line-height:1.2;box-shadow:0 2px 6px rgba(0,0,0,.18);touch-action:manipulation}
.sbtn[hidden]{display:none}
#fertBtn{right:124px;bottom:calc(34px + env(safe-area-inset-bottom,0px))}
#fertBtn.off{opacity:.55}
#waterAll{right:36px;bottom:calc(136px + env(safe-area-inset-bottom,0px))}
#decorEdit{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(170px + env(safe-area-inset-bottom,0px));background:var(--paper);border:2px solid var(--mustard);border-radius:14px;padding:8px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;z-index:12;width:min(440px,calc(100vw - 24px))}
#decorEdit[hidden]{display:none}
#pdim{position:fixed;inset:0;background:rgba(10,20,5,.4);z-index:28}
#pdim[hidden]{display:none}
.panel{position:fixed;left:0;right:0;bottom:0;top:calc(6vh + env(safe-area-inset-top,0px));background:var(--paper);border-radius:20px 20px 0 0;z-index:29;display:flex;flex-direction:column;max-width:560px;margin:0 auto}
.panel[hidden]{display:none}
.ph{display:flex;align-items:center;justify-content:space-between;padding:10px 16px;border-bottom:1px solid var(--line)}
.ph h2{margin:0}
.pb{overflow-y:auto;padding:12px 16px calc(28px + env(safe-area-inset-bottom,0px));flex:1;-webkit-overflow-scrolling:touch;touch-action:pan-y}
.xbtn{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--chip);color:var(--ink);font-size:18px;flex:none}
#sheet{touch-action:pan-y;padding-top:0}
.shead{position:sticky;top:0;background:var(--paper);display:flex;align-items:center;justify-content:center;height:46px;z-index:3;margin:0 -18px 4px}
.shead .grip{margin:0}
#sheetX{position:absolute;right:12px;top:4px}
.decorItems{flex-wrap:wrap;overflow:visible}
.ditem{width:76px}
#tut{left:10px;right:auto;transform:none;top:calc(84px + env(safe-area-inset-top,0px));bottom:auto;width:min(420px,calc(100vw - 92px))}
#toast{top:calc(120px + env(safe-area-inset-top,0px));bottom:auto}
.settings{margin-top:0;border-top:0;padding-top:0}
:root{--paper:#FFF8E7;--chip:#F8E8C4;--line:#E2C796;--ink:#3A2416;--muted:#7A5A3A;--accent:#4FAE2E;--onAccent:#FFFFFF;--bg:#8FD45E;--danger:#C23B22;--mustard:#F2B01E}
body.game{background:#5E9E38}
#iconbar button{border:2px solid #5A3416;background:#FFF6DE;color:#5A3416;box-shadow:0 3px 0 #5A3416;border-radius:16px;font-weight:700}
#iconbar button:active{transform:translateY(2px);box-shadow:0 1px 0 #5A3416}
.hudTop .coins,.sceneName{border:2px solid #5A3416;background:#FFF6DE;color:#5A3416;font-weight:700;box-shadow:0 2px 0 #5A3416}
#actBtn{background:#5DBB3A;border:3px solid #2F6B1E;box-shadow:0 5px 0 #2F6B1E;text-shadow:0 2px 0 #2F6B1E}
#actBtn:active{transform:translateY(3px);box-shadow:0 2px 0 #2F6B1E}

const MY_SLOTS=10,BAG_SLOTS=40;
function ensureSlots(){
  if(!state||!Array.isArray(state.lots))return;
  const used=new Set();
  for(const l of state.lots){if(Number.isInteger(l.slot)&&l.slot>=0&&l.slot<BAG_SLOTS&&!used.has(l.slot))used.add(l.slot);else l.slot=null}
  const order=[...Array(BAG_SLOTS-MY_SLOTS).keys()].map(k=>k+MY_SLOTS).concat([...Array(MY_SLOTS).keys()]);
  const over=[];
  for(const l of state.lots){if(l.slot!=null)continue;const k=order.find(k=>!used.has(k));if(k==null){over.push(l);continue}l.slot=k;used.add(k)}
  if(over.length){
    for(const l of over){let c=vaultCabs().find(x=>x.crop===l.crop&&x.name==='暫存櫃');if(!c){c={id:'V'+Date.now().toString(36)+l.crop,name:'暫存櫃',crop:l.crop,lots:[],at:Date.now()};vaultCabs().push(c)}c.lots.unshift(l);delete l.slot}
    state.lots=state.lots.filter(l=>!over.includes(l));
    setTimeout(()=>toast(`種子袋滿了，${over.length} 包新種子先放進種原庫的「暫存櫃」`),50);
  }
}
function slotCell(k,lot){
  if(!lot)return `<div class="slot empty${k<MY_SLOTS?' my':''}" data-slot="${k}"></div>`;
  let ic='';try{ic=fruitSVG(likely(lot).app,lot.crop,44)}catch(e){ic='？'}
  return `<button class="slot${k<MY_SLOTS?' my':''}" data-slot="${k}" data-lot="${lot.id}" aria-label="${esc(lot.name)}，${CROPS[lot.crop].n}，${lc(lot)} 顆">${ic}<b class="cnt">${lc(lot)}</b><span class="nm">${esc(lot.name)}</span></button>`;
}
function bagGridHTML(){
  const by={};for(const l of state.lots)if(l.slot!=null)by[l.slot]=l;
  let h=`<h3 class="slh">我的種子</h3><div class="slots">`;for(let k=0;k<MY_SLOTS;k++)h+=slotCell(k,by[k]);h+='</div>';
  h+=`<div class="slh2"><h3 class="slh">其他種子</h3><button class="mini" data-bagsort="1">整理</button></div><div class="slots">`;for(let k=MY_SLOTS;k<BAG_SLOTS;k++)h+=slotCell(k,by[k]);h+='</div>';
  h+=`<p class="note">點一下打開種子；按住拖曳可以換位置（電腦可以直接拖）。正在用的放「我的種子」，播種時會排在最前面。長期不用的可以存進種原庫。</p>`;

let bagDrag=null,bagLong=null,bagSuppress=false;
function bagDragStart(el,x,y){const r=el.getBoundingClientRect();const g=el.cloneNode(true);g.classList.add('ghost');g.style.width=r.width+'px';g.style.height=r.height+'px';document.body.appendChild(g);bagDrag={from:+el.dataset.slot,lot:+el.dataset.lot,ghost:g,ox:r.width/2,oy:r.height/2};el.classList.add('lift');bagDragMove(x,y)}
function bagDragMove(x,y){if(!bagDrag)return;bagDrag.ghost.style.left=(x-bagDrag.ox)+'px';bagDrag.ghost.style.top=(y-bagDrag.oy)+'px';document.querySelectorAll('.slot.over').forEach(e=>e.classList.remove('over'));bagDrag.ghost.style.display='none';const t=document.elementFromPoint(x,y);bagDrag.ghost.style.display='';const c=t&&t.closest&&t.closest('#bag [data-slot]');if(c)c.classList.add('over')}
function bagDragEnd(x,y){
  if(!bagDrag)return;const d=bagDrag;bagDrag=null;d.ghost.remove();bagSuppress=true;setTimeout(()=>bagSuppress=false,50);
  const t=document.elementFromPoint(x,y),c=t&&t.closest&&t.closest('#bag [data-slot]');
  if(c){const to=+c.dataset.slot;if(to!==d.from){const a=state.lots.find(l=>l.id===d.lot),b=state.lots.find(l=>l.slot===to);if(a){if(b)b.slot=d.from;a.slot=to;save()}}}
  renderBag();
}
(()=>{const bag=document.getElementById('bag');
  bag.addEventListener('pointerdown',e=>{if(bagTab!=='bag')return;const el=e.target.closest('.slot[data-lot]');if(!el)return;const sx=e.clientX,sy=e.clientY;
    if(e.pointerType==='mouse'){bagLong={el,sx,sy,mouse:true};return}
    bagLong={el,sx,sy,timer:setTimeout(()=>{if(bagLong&&bagLong.el===el){bagDragStart(el,bagLong.lx||sx,bagLong.ly||sy);if(navigator.vibrate)navigator.vibrate(15)}},300)}});
  window.addEventListener('pointermove',e=>{
    if(bagDrag){e.preventDefault();bagDragMove(e.clientX,e.clientY);return}
    if(!bagLong)return;bagLong.lx=e.clientX;bagLong.ly=e.clientY;const mv=Math.hypot(e.clientX-bagLong.sx,e.clientY-bagLong.sy);
    if(bagLong.mouse&&mv>6){const el=bagLong.el;bagLong=null;bagDragStart(el,e.clientX,e.clientY);return}
    if(!bagLong.mouse&&mv>10){clearTimeout(bagLong.timer);bagLong=null}});
  const up=e=>{if(bagLong){clearTimeout(bagLong.timer);bagLong=null}if(bagDrag)bagDragEnd(e.clientX,e.clientY)};
  window.addEventListener('pointerup',up);window.addEventListener('pointercancel',e=>{if(bagDrag){bagDrag.ghost.remove();bagDrag=null;renderBag()}if(bagLong){clearTimeout(bagLong.timer);bagLong=null}});
  bag.addEventListener('touchmove',e=>{if(bagDrag){e.preventDefault();const t=e.touches[0];if(t)bagDragMove(t.clientX,t.clientY)}},{passive:false});
  bag.addEventListener('touchend',e=>{if(bagDrag){const t=e.changedTouches[0];if(t)bagDragEnd(t.clientX,t.clientY)}});
  bag.addEventListener('contextmenu',e=>{if(e.target.closest('.slot'))e.preventDefault()});
  bag.addEventListener('click',e=>{if(bagSuppress){e.stopPropagation();e.preventDefault();return}const s=e.target.closest('[data-bagsort]');if(s)bagArrange()},true);
})();

function removeSeeds(l,n){if(l.seeds)l.seeds.splice(0,n);else l.count-=n;if(!lc(l))state.lots=state.lots.filter(x=>x!==l)}
async function lotAction(act,b){
  const l=state.lots.find(x=>x.id===sheet.lot);if(!l)return closeSheet();
  if(act==='lform'){sheet.form=b.dataset.f;sheet.err='';sheet.d1=sheet.form==='rename'?l.name:sheet.form==='npc'?String(lc(l)):sheet.form==='vault'?'':'1';sheet.d2='';renderSheet();return}
  if(act==='vdep'){const c=vaultCabs().find(x=>x.id===b.dataset.c);if(!c)return;state.lots=state.lots.filter(x=>x!==l);c.lots.unshift(l);for(const p of state.plots)if(p&&p.lotId===l.id)p.lotId=null;save();renderAll();closeSheet();toast(`「${l.name}」已存入「${c.name}」`);return}
  if(act==='vdepnew'){const v=(sheet.d1||'').trim();if(!glen(v)||glen(v)>10){sheet.err='名稱需要 1 到 10 個字';renderSheet();return}
    if(vaultCabs().some(x=>x.crop===l.crop&&norm(x.name)===norm(v))){sheet.err='已經有同名的保存櫃了';renderSheet();return}
    const c={id:'V'+Date.now().toString(36),name:v,crop:l.crop,lots:[l],at:Date.now()};vaultCabs().push(c);state.lots=state.lots.filter(x=>x!==l);save();renderAll();closeSheet();toast(`建立保存櫃「${v}」並存入「${l.name}」`);return}
  if(act==='lcancel'){sheet.form=null;renderSheet();return}
  if(act==='ldiscard'){if(!sheet.confirm){sheet.confirm=true;renderSheet();return}state.lots=state.lots.filter(x=>x!==l);save();renderAll();closeSheet();toast('已丟掉這包種子');return}
  if(act!=='lsave')return;
  const n=lc(l);sheet.err='';
  if(sheet.form==='rename'){
    const v=sheet.d1.trim(),len=glen(v);
    if(!len)sheet.err='請輸入名稱';else if(len>8)sheet.err='名稱最多 8 個字';
    else if(state.lots.some(x=>x!==l&&norm(x.name)===norm(v)))sheet.err='種子袋裡已經有這個名稱了，換一個吧';
    if(sheet.err){renderSheet();return}
    l.name=v;for(const p of state.plots)if(p&&p.lotId===l.id)p.name=v;
    sheet.form=null;save();renderAll();renderSheet();toast(`已改名為「${v}」`);return;
  }
  const k=parseInt(sheet.d1,10);
  if(!(k>=1&&k<=n)){sheet.err=`數量要在 1 到 ${n} 之間`;renderSheet();return}
  if(sheet.form==='npc'){const total=k*seedPrice(l);state.coins+=total;removeSeeds(l,k);save();renderAll();toast(`賣給種子行 ${k} 顆，得到 ${total} 金幣`);if(state.lots.includes(l)){sheet.form=null;renderSheet()}else closeSheet();return}
  if(sheet.form==='sell'){
    const price=parseInt(sheet.d2,10);
    if(!(price>=1&&price<=999999)){sheet.err='請輸入 1 以上的價格';renderSheet();return}
    const payload={m:l.m,f:l.f,count:k,germ:l.germ};if(l.seeds)payload.seeds=l.seeds.slice(0,k);
    try{
      await db.collection('listings').add({v:4,crop:l.crop,name:l.name,source:l.source,sellerUid:uid,sellerName:myName(),price,count:k,lot:packState(payload),sold:false,createdAt:TS()});
      removeSeeds(l,k);save();renderAll();toast(`已上架 ${k} 顆「${l.name}」，售價 ${price} 金幣`);
      if(state.lots.includes(l)){sheet.form=null;renderSheet()}else closeSheet();
    }catch(e){sheet.err='上架失敗，請檢查網路後再試一次';renderSheet()}
  }
}

const BOARDS=[['big','巨大榜','大小',1],['small','迷你榜','大小',-1],['perfect','完美榜','完美度',1],['weird','奇異榜','完美度',-1]];
const BOARD_PTS=r=>r===1?5:r<=3?3:r<=10?1:0;
let boardsList=[],boardCrop=null;
const bVal=(b,ph)=>b==='big'||b==='small'?ph.ab.size:ph.ab.perf;
function boardRank(crop,b){const dir=BOARDS.find(x=>x[0]===b)[3];return boardsList.filter(e=>e.crop===crop&&e.board===b).sort((x,y)=>dir*(y.value-x.value)||(x.at||0)-(y.at||0))}
async function submitBoards(p){
  if(!uid||!p)return;const ph=phen(p.g,p.crop),me=myName();
  for(const [b,bn,vn,dir] of BOARDS){
    const v=bVal(b,ph),id=`${p.crop}_${b}_${uid}`,cur=boardsList.find(e=>e.id===id);
    if(cur&&dir*(v-cur.value)<=0)continue;
    const doc={v:4,crop:p.crop,board:b,uid,name:me,value:v,key:ph.key,perfCls:ph.perfCls,plant:pname(p),at:Date.now()};
    const prevTop=boardRank(p.crop,b)[0];
    try{await db.collection('boards').doc(id).set(doc);
      const tmp=boardsList.filter(e=>e.id!==id).concat([{id,...doc}]);const rk=tmp.filter(e=>e.crop===p.crop&&e.board===b).sort((x,y)=>dir*(y.value-x.value)||(x.at||0)-(y.at||0)).findIndex(e=>e.id===id)+1;
      if(rk&&rk<=10)toast(`你的「${pname(p)}」登上${CROPS[p.crop].n}${bn}第 ${rk} 名（${vn} ${v}）`);
      const notable={big:ph.sizeCls>=3,small:ph.sizeCls<=1,perfect:ph.perfCls>=2,weird:ph.perfCls<=1}[b];
      if(rk===1&&notable&&prevTop&&prevTop.uid!==uid)postNews('board',`🏆 ${me} 的「${pname(p)}」登上${CROPS[p.crop].n}${bn}第 1 名！（${vn} ${v}）`,3);
    }catch(e){}
  }
}

}

async function dexAction(b){

  if(a==='appraise')return appraise(id);
  if(a==='rsave'){rerr[id]=await rightRename(id,rdraft[id]!=null?rdraft[id]:'');if(!rerr[id]){delete rdraft[id];toast('已儲存名稱')}renderDex();return}
  if(a==='rpub'){const r=rightsList.find(x=>x.id===id);if(!r)return;if(rdraft[id]!=null&&rdraft[id].trim()!==(r.name||'')){rerr[id]='請先按「儲存名稱」';renderDex();return}if(!r.name){rerr[id]='請先命名並儲存';renderDex();return}if(rconfirm!==id){rconfirm=id;renderDex();return}rconfirm=null;await rightPublish(id);renderDex();return}

  if(a==='rbuy')return rightBuy(id);
}

function infoHTML(ph,lvl,g,crop,noSims,p){

    h+=`<div class="badges"><span class="badge r${ph.tier}">${TIERS[ph.tier]}</span><span class="badge">${stabName(ph.stab)}</span></div><p class="note" style="text-align:center">外觀穩定度：自交後約 ${pctTxt(ph.stab)} 會保留這個外觀。</p>`;
  }else if(lvl<2)h+=`<p class="note">外觀會在開花時揭曉。</p>`;

}

async function doRegister(i){
  const p=state.plots[i];if(!p||p.stage!=='ripe')return;
  const ph=phen(p.g,p.crop),v=regDraft.trim(),len=glen(v);
  regErr='';
  if(len<2||len>8)regErr='名稱需要 2 到 8 個字';
  else if(regList.some(r=>r.norm===norm(v)))regErr='圖鑑裡已經有這個名稱了';
  else if(ph.stab<0.95)regErr='外觀穩定度需要 95% 以上';
  else if(findVariety(p.crop,ph.key))regErr='已經有相同外觀的品種了';
  if(regErr){renderSheet();return}
  const me=myName(),ab_=ph.ab;
  try{
    await db.collection('registry').add({v:4,crop:p.crop,name:v,norm:norm(v),inventorUid:uid,inventorName:me,at:TS(),app:ph.key,g:JSON.stringify(p.g),tier:ph.tier,rec:{big:{v:ab_.size,by:me},small:{v:ab_.size,by:me},perfect:{v:ab_.perf,by:me},weird:{v:ab_.perf,by:me}}});
    for(const l of state.lots)if(l.lid===p.lid)l.name=v;
    for(const q of state.plots)if(q&&q.lid===p.lid)q.name=v;
    regDraft='';save();renderAll();renderSheet();toast(`已登錄新品種「${v}」，名字會永遠留在圖鑑上`);
  }catch(e){regErr='登錄失敗，請檢查網路後再試一次';renderSheet()}
}
async function doRecord(i){
  const p=state.plots[i];if(!p)return;
  const ph=phen(p.g,p.crop),v=findVariety(p.crop,ph.key);if(!v||v.tmp||v.inventorUid==='system')return;
  const rc={...(v.rec||{})},me=myName(),msg=[],s_=ph.ab.size,pf=ph.ab.perf;
  if(!rc.big||s_>rc.big.v){rc.big={v:s_,by:me,uid};msg.push('最大')}
  if(!rc.small||s_<rc.small.v){rc.small={v:s_,by:me,uid};msg.push('最小')}
  if(!rc.perfect||pf>rc.perfect.v){rc.perfect={v:pf,by:me,uid};msg.push('最完美')}
  if(!rc.weird||pf<rc.weird.v){rc.weird={v:pf,by:me,uid};msg.push('最奇異')}
  if(!msg.length)return;
  try{await db.collection('registry').doc(v.id).update({rec:rc});v.rec=rc;toast(`你的「${pname(p)}」刷新了「${v.name}」的${msg.join('、')}紀錄`)}catch(e){}
}

function progInfo(p){
  const ph=phen(p.g,p.crop);
  if(p.stage==='flower')return {pct:p.flowerT/(24*HOUR)*100,txt:`若不處理，${fmt((24*HOUR-p.flowerT)/state.speed)}後會自動自花授粉`};
  const dur=stageDur(p,ph),pct=clamp(p.prog/dur*100,0,100);
  if(!p.watered)return {pct,txt:'需要澆水才會繼續生長'};
  return {pct,txt:`約 ${fmt((dur-p.prog)/((p.fert?1.25:1)*state.speed))}後進入下一階段`};
}

const animO={};
function animOthers(dt){
  for(const [id,o] of Object.entries(others)){if(!o||typeof o.x!=='number')continue;

async function stallAction(b){
  const act=b.dataset.act,i=sheet.stall;
  if(act==='sstart'){sheet.step='pick';renderSheet();return}
  if(act==='sback'){sheet.step=sheet.step==='form'?'pick':sheet.step==='iform'?'ipick':'view';sheet.ksel=null;sheet.err='';renderSheet();return}
  if(act==='istart'){sheet.step='ipick';renderSheet();return}
  if(act==='kstart'){sheet.step='kpick';sheet.ksel=null;sheet.d2='';sheet.err='';renderSheet();return}
  if(act==='kpick'){sheet.ksel=b.dataset.k;renderSheet();return}
  if(act==='ksave'){
    const sp=(state.specimens||[]).find(x=>x.id===sheet.ksel);if(!sp)return;const price=parseInt(sheet.d2,10);
    const inf=stallInfo(i);if(inf.owner&&inf.owner!==uid){sheet.err='這個攤位剛被別人占用了';renderSheet();return}
    if(!(price>=1&&price<=9999999)){sheet.err='請輸入 1 以上的價格';renderSheet();return}
    b.disabled=true;
    try{await db.collection('listings').add({v:4,kind:'spec',crop:sp.crop,name:(sp.kind==='gem'?'珍品標本':'果實標本'),source:sp.from,sellerUid:uid,sellerName:myName(),price,count:1,stall:i,lot:packState({spec:sp}),sold:false,createdAt:TS()});
      state.specimens=state.specimens.filter(x=>x!==sp);save();sheet.step='view';renderSheet();toast('標本已上架')}catch(e){sheet.err='上架失敗，請檢查網路後再試一次';renderSheet()}
    return;
  }
  if(act==='ipick'){sheet.ik=b.dataset.k;sheet.step='iform';sheet.d1='1';sheet.d2='';sheet.err='';renderSheet();return}
  if(act==='isave'){
    const k=sheet.ik,it=state.items||{},n=it[k]||0;
    const inf=stallInfo(i);if(inf.owner&&inf.owner!==uid){sheet.err='這個攤位剛被別人占用了，換一個空攤位吧';renderSheet();return}
    const c=parseInt(sheet.d1,10),price=parseInt(sheet.d2,10);
    if(!(c>=1&&c<=n)){sheet.err=`數量要在 1 到 ${n} 之間`;renderSheet();return}
    if(!(price>=1&&price<=999999)){sheet.err='請輸入 1 以上的價格';renderSheet();return}
    b.disabled=true;
    try{
      await db.collection('listings').add({kind:'item',item:k,crop:'',name:itemName(k),source:'道具',sellerUid:uid,sellerName:myName(),price,count:c,stall:i,lot:'{}',sold:false,createdAt:TS()});
      it[k]-=c;save();renderAll();sheet.step='view';renderSheet();toast(`已上架 ${c} 個${itemName(k)}，售價 ${price} 金幣`);
    }catch(e){sheet.err='上架失敗，請檢查網路後再試一次';renderSheet()}
    return;
  }
  if(act==='spick'){sheet.lot=+b.dataset.lot;sheet.step='form';sheet.d1='1';sheet.d2='';sheet.err='';renderSheet();return}
  if(act==='ssave'){
    const l=state.lots.find(x=>x.id===sheet.lot);if(!l)return;
    const inf=stallInfo(i);if(inf.owner&&inf.owner!==uid){sheet.err='這個攤位剛被別人占用了，換一個空攤位吧';renderSheet();return}
    const n=lc(l),k=parseInt(sheet.d1,10),price=parseInt(sheet.d2,10);
    if(!(k>=1&&k<=n)){sheet.err=`數量要在 1 到 ${n} 之間`;renderSheet();return}
    if(!(price>=1&&price<=999999)){sheet.err='請輸入 1 以上的價格';renderSheet();return}
    const payload={m:l.m,f:l.f,count:k,germ:l.germ,wide:!!l.wide,par:l.par,gpar:l.gpar,ptier:l.ptier};if(l.seeds)payload.seeds=l.seeds.slice(0,k);
    b.disabled=true;
    try{
      await db.collection('listings').add({v:4,crop:l.crop,name:l.name,source:l.source,sellerUid:uid,sellerName:myName(),price,count:k,stall:i,lot:packState(payload),sold:false,createdAt:TS()});
      removeSeeds(l,k);save();renderAll();sheet.step='view';renderSheet();toast(`已在攤位上架 ${k} 顆「${l.name}」，售價 ${price} 金幣`);
    }catch(e){sheet.err='上架失敗，請檢查網路後再試一次';renderSheet()}
    return;
  }
  if(act==='sbuy'){
    const l=listings.find(x=>x.id===b.dataset.id);if(!l||l.sold)return;
    if(state.coins<l.price){toast('金幣不夠');return}
    b.disabled=true;
    try{
      await db.runTransaction(async tx=>{const ref=db.collection('listings').doc(l.id),d=await tx.get(ref);if(!d.exists||d.data().sold)throw new Error('gone');tx.update(ref,{sold:true,buyerUid:uid,buyerName:myName(),soldAt:TS()})});
      if(l.kind==='spec'){if(!TEST_MODE)state.coins-=l.price;const o=lotOf(l);if(!state.specimens)state.specimens=[];if(o&&o.spec)state.specimens.unshift({...o.spec,id:'S'+Date.now().toString(36)});save();renderAll();toast('買到標本了，在「圖鑑 → 標本與品種權」');return}
      if(l.kind==='item'){if(TEST_MODE)state.coins+=l.price;state.coins-=l.price;if(!state.items)state.items={};state.items[l.item]=(state.items[l.item]||0)+l.count;save();renderAll();toast(`買到 ${l.count} 個${itemName(l.item)}`);return}
      const lot=lotOf(l);if(!TEST_MODE)state.coins-=l.price;
      state.lots.unshift({id:state.nextLot++,lid:'L'+(state.nextLid++),crop:l.crop,name:l.name,source:`${l.source}（向 ${l.sellerName} 購買）`,m:lot.m,f:lot.f,count:lot.seeds?0:lot.count,seeds:lot.seeds||undefined,germ:lot.germ,wide:!!lot.wide,par:lot.par,gpar:lot.gpar,ptier:lot.ptier});
      save();renderAll();toast(`買到 ${l.count} 顆「${l.name}」，已放進種子袋`);
    }catch(err){toast('這包種子已經被買走了');b.disabled=false}
    return;
  }
  if(act==='scancel'){
    const l=listings.find(x=>x.id===b.dataset.id);if(!l||l.sold)return;
    b.disabled=true;
    try{
      await db.collection('listings').doc(l.id).delete();
      if(l.kind==='spec'){const o=lotOf(l);if(!state.specimens)state.specimens=[];if(o&&o.spec)state.specimens.unshift(o.spec);save();renderAll();toast('已收回標本');return}
      if(l.kind==='item'){if(!state.items)state.items={};state.items[l.item]=(state.items[l.item]||0)+l.count;save();renderAll();toast('已收回，道具放回背包');return}
      const lot=lotOf(l);
      state.lots.unshift({id:state.nextLot++,lid:'L'+(state.nextLid++),crop:l.crop,name:l.name,source:l.source,m:lot.m,f:lot.f,count:lot.seeds?0:lot.count,seeds:lot.seeds||undefined,germ:lot.germ,wide:!!lot.wide,par:lot.par,gpar:lot.gpar,ptier:lot.ptier});
      save();renderAll();toast('已收回，種子放回種子袋');
    }catch(err){toast('收回失敗，可能已經被買走了');b.disabled=false}
  }
}

const weekKey=()=>{const d=new Date(),j=new Date(d.getFullYear(),0,1);return `${d.getFullYear()}-W${Math.ceil(((d-j)/DAY+j.getDay()+1)/7)}`};
function ownedCrops(){const s=new Set();state.lots.forEach(l=>s.add(l.crop));state.plots.forEach(p=>p&&s.add(p.crop));return [...s].length?[...s]:['tomato']}
function condTxt(c){
  const crop=c.crop?CROPS[c.crop].n:'任何作物';const bits=[];
  if(c.minLevel!=null)bits.push(`形狀達到「${(CROPS[c.crop||'tomato']).shapes[c.minLevel]}」以上`);
  if(c.skin)bits.push(`${CN[c.skin]}色`);if(c.pat)bits.push('有花紋');if(c.minSize!=null)bits.push(`${SIZE_N[c.minSize]}以上`);if(c.minTier!=null)bits.push(`${TIERS[c.minTier]}以上`);
  return `交出一顆${bits.join('、')}的${crop}`;
}
function condOk(c,p,ph){return (!c.crop||c.crop===p.crop)&&(c.minLevel==null||(!ph.sp&&ph.level>=c.minLevel))&&(!c.skin||ph.skin===c.skin)&&(!c.pat||!!ph.pat)&&(c.minSize==null||ph.sizeCls>=c.minSize)&&(c.minTier==null||ph.tier>=c.minTier)}
function ensureDaily(){
  const dk=dayKey();
  if(!state.daily||state.daily.day!==dk){
    const R=srand(hashStr(dk+uid)),crops=ownedCrops(),pickC=()=>crops[Math.floor(R()*crops.length)];
    const skinsOf=c=>{const s=new Set();state.lots.filter(l=>l.crop===c).forEach(l=>{try{lotDist(l).forEach(x=>s.add(x.app.skin))}catch(e){}});state.plots.forEach(p=>{if(p&&p.crop===c)s.add(phen(p.g,c).skin)});return [...s].length?[...s]:['red']};
    const c1=pickC(),sk=skinsOf(c1),c2=pickC(),c3=pickC();
    state.daily={day:dk,list:[
      {id:'d1',c:{crop:c1,skin:sk[Math.floor(R()*sk.length)]},r:50+10*Math.floor(R()*6),done:false},
      {id:'d2',c:R()<.5?{crop:c2,pat:true}:{crop:c2,minLevel:2},r:150+10*Math.floor(R()*11),done:false},
      {id:'d3',c:{crop:c3,minSize:3},r:200+10*Math.floor(R()*11),done:false}]};
  }
  const wk=weekKey();
  if(!state.weekly||state.weekly.wk!==wk){const R=srand(hashStr(wk+uid));
    state.weekly={wk,done:false,...(R()<.5?{c:{minLevel:5},r:600,prize:'rare',pt:'珍稀種原 1 包'}:{c:{minTier:3},r:500,prize:'y3',pt:'高級增產肥料 2 個'})}}
}
function deliverables(p,ph){ensureDaily();const out=state.daily.list.filter(o=>!o.done&&condOk(o.c,p,ph)).map(o=>({id:o.id,t:condTxt(o.c),r:o.r}));if(!state.weekly.done&&condOk(state.weekly.c,p,ph))out.push({id:'w',t:condTxt(state.weekly.c),r:state.weekly.r,pt:state.weekly.pt});return out}
function deliver(i,oid){
  const p=state.plots[i];if(!p||p.stage!=='ripe')return;const ph=phen(p.g,p.crop);ensureDaily();
  if(oid==='w'){const w=state.weekly;if(w.done||!condOk(w.c,p,ph))return;w.done=true;state.coins+=w.r;
    if(w.prize==='rare'){const r=giveWild(BIOME_KEYS[Math.floor(rnd()*BIOME_KEYS.length)],true);toast(`完成每週挑戰！得到 ${w.r} 金幣和珍稀種原「${r.name}」`)}else{state.items.y3=(state.items.y3||0)+2;toast(`完成每週挑戰！得到 ${w.r} 金幣和高級增產肥料 2 個`)}}
  else{const o=state.daily.list.find(x=>x.id===oid);if(!o||o.done||!condOk(o.c,p,ph))return;o.done=true;state.coins+=o.r;toast(`完成每日訂單，得到 ${o.r} 金幣`)}
  harvested(ph);afterHarvest(i);
}

function makeWild(crop,bk,rare){

  const col=pk(B.cols),pfw=B.pf||[0,1,2,3,4,5];
  const g=makeOriginal({pointed:Math.min(SHN,nP),color:col,pf:pk(pfw),rare});
  if(rare)g.sp=[0,wpk(SPSH_W)];
  if(bk==='marsh'){const lo=rnd()<.5;g.n.size=numLoci(lo?0.1:0.9,0.08)}
  if(bk==='forest')g.n.vigor=numLoci(0.72+rnd()*0.1);

function nearest(){
  const m=curMe();
  if(scene==='explore'){
    if(Math.hypot(EXGATE[0]-m.x,EXGATE[1]-m.y)<56)return {t:'gate'};
    let best=null,bdist=46;for(const it of exVisibleItems()){const d=Math.hypot(it.x-m.x,(it.y-m.y)*1.3);if(d<bdist){bdist=d;best=it}}
    return best?{t:'item',it:best}:null;
  }
  if(scene==='market'){
    let bi=-1,bdist=1e9;STALLS.forEach(([x,y],i)=>{const d=Math.hypot(x-m.x,(y-m.y)*1.3);if(d<bdist){bdist=d;bi=i}});
    if(bdist<72)return {t:'stall',i:bi};
    const [gx,gy]=GATE.market;if(Math.hypot(gx-m.x,gy-m.y)<56)return {t:'gate'};return null;
  }
  const [gx,gy]=GATE.farm;if(Math.hypot(gx-m.x,gy-m.y)<56)return {t:'gate'};
  const fst=viewing?viewing.st:state;if(!fst)return null;
  let best=-1,b2=1e9;for(let i=0;i<fst.plots.length;i++){const pos=posOf(fst,i);if(!pos)continue;const [x,y]=pos,dx=x-m.x,dy=(y-m.y)*1.7,d2=dx*dx+dy*dy;if(d2<b2){b2=d2;best=i}}
  return b2<48*48?{t:'plot',i:best}:null;
}
function actInfo(n){
  if(!n)return {label:'互動',on:false};
  if(n.t==='gate')return {label:scene==='farm'?'去市集':'回農場',on:true};
  if(n.t==='item')return {label:'撿起',on:true};
  if(n.t==='stall')return {label:'攤位',on:true};
  if(viewing){const p=viewing.st&&viewing.st.plots[n.i];return {label:p?'查看':'空地',on:!!p}}
  const p=state.plots[n.i];
  if(!p)return {label:'播種',on:true};
  if((p.stage==='seedling'||p.stage==='fruit')&&!p.watered)return {label:'澆水',on:true};
  if(p.stage==='flower')return {label:'授粉',on:true};
  if(p.stage==='ripe')return {label:'收成',on:true};
  return {label:'查看',on:true};
}

function handleTap(e,cx,cy){
  if(!state||curPanel)return;
  const w=screenToWorld(cx,cy),t=e&&e.target;
  if(buildMode){buildTap(w,t);return}
  if(ctrlMode==='joy'){
    const g2=t&&t.closest&&t.closest('[data-plot]'),st2=t&&t.closest&&t.closest('[data-stall]'),dg2=t&&t.closest&&t.closest('[data-decor]'),ie2=t&&t.closest&&t.closest('[data-item]');
    if(scene==='explore'){if(ie2){const it=exVisibleItems().find(x=>x.key===ie2.dataset.item);if(it){const m=curMe();if(Math.hypot(it.x-m.x,it.y-m.y)<80)pickItem(it);else toast('走近一點才能撿起來')}}return}
    if(scene==='market'){if(st2)openStall(+st2.dataset.stall);return}

    if(dg2){selDecor=+dg2.dataset.decor;renderWorld();renderDecorEdit();return}
    if(selDecor!=null){selDecor=null;renderWorld();renderDecorEdit();return}
    if(g2)openPlot(+g2.dataset.plot);
    return;
  }
  const g=t&&t.closest&&t.closest('[data-plot]'),stg=t&&t.closest&&t.closest('[data-stall]'),dg=t&&t.closest&&t.closest('[data-decor]'),ie=t&&t.closest&&t.closest('[data-item]');
  if(scene==='explore'&&ie){const it=exVisibleItems().find(x=>x.key===ie.dataset.item);if(it){walkTo(it.x,it.y+6,()=>pickItem(it));return}}
  if(scene==='market'){let si=stg?+stg.dataset.stall:-1;if(si<0){let bd=90;STALLS.forEach(([x,y],k)=>{const d=Math.hypot(x-w.x,(y-20-w.y)*0.9);if(d<bd){bd=d;si=k}})}if(si>=0){const [sx,sy]=STALLS[si];walkTo(sx,sy+34,()=>openStall(si));return}}
  if(scene==='explore'&&!ie){let best=null,bd=34;for(const it of exVisibleItems()){const d=Math.hypot(it.x-w.x,it.y-w.y);if(d<bd){bd=d;best=it}}if(best){walkTo(best.x,best.y+6,()=>pickItem(best));return}}
  if(scene==='farm'&&!viewing){
    if(dg){selDecor=+dg.dataset.decor;renderWorld();renderDecorEdit();return}
    if(selDecor!=null){selDecor=null;renderWorld();renderDecorEdit();return}
  }

  walkTo(w.x,w.y,null);
}

const ptrs=new Map();let pinch=null,tapStart=null,dragPlot=null,panStart=null;
sceneEl.addEventListener('pointerdown',e=>{
  if(!state)return;ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  try{sceneEl.setPointerCapture(e.pointerId)}catch(_){}
  if(ptrs.size===2){const [a,b]=[...ptrs.values()];pinch={d:Math.hypot(a.x-b.x,a.y-b.y),z:zoom};tapStart=null;dragPlot=null;panStart=null;return}
  tapStart={x:e.clientX,y:e.clientY,t:Date.now(),target:e.target,moved:false};
  if(buildMode){
    const g=e.target.closest&&e.target.closest('[data-plot]');

    else panStart={x:e.clientX,y:e.clientY,cx:buildCam.x,cy:buildCam.y};
  }
});
sceneEl.addEventListener('pointermove',e=>{
  if(!ptrs.has(e.pointerId))return;ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(pinch&&ptrs.size>=2){const [a,b]=[...ptrs.values()];const d=Math.hypot(a.x-b.x,a.y-b.y);if(pinch.d>0)setZoom(pinch.z*d/pinch.d);return}
  if(tapStart&&Math.hypot(e.clientX-tapStart.x,e.clientY-tapStart.y)>10)tapStart.moved=true;
  if(dragPlot&&tapStart&&tapStart.moved){const w=screenToWorld(e.clientX,e.clientY);dragPlot.x=w.x;dragPlot.y=w.y;dragPlot.on=true;renderWorld();return}
  if(panStart&&tapStart&&tapStart.moved){const r=sceneEl.getBoundingClientRect(),vb=sceneEl.viewBox.baseVal,s=vb.width/r.width;buildCam.x=panStart.cx-(e.clientX-panStart.x)*s;buildCam.y=panStart.cy-(e.clientY-panStart.y)*s;updateCam()}
});
const ptrEnd=e=>{
  if(!ptrs.has(e.pointerId))return;ptrs.delete(e.pointerId);
  if(pinch){if(ptrs.size<2)pinch=null;return}
  if(dragPlot){const d=dragPlot;dragPlot=null;if(d.on){const [x,y]=snapPos(d.x,d.y),err=plotSpotErr(state,x,y,d.i);if(err){toast(err)}else{state.plotPos[d.i]=[x,y];save();toast('農地移好了')}renderWorld();tapStart=null;return}}
  panStart=null;
  if(tapStart&&!tapStart.moved&&e.type==='pointerup'){const ts=tapStart;tapStart=null;handleTap({target:ts.target},e.clientX,e.clientY);return}
  tapStart=null;
};

function buildTap(w,t){

function walkLoop(t){
  const dt=Math.min(0.05,(t-lastF)/1000);lastF=t;
  let vx=joy.vx,vy=joy.vy,arrive=false;
  if(moveTo&&state&&!curPanel){const m=curMe(),dx=moveTo.x-m.x,dy=moveTo.y-m.y,d=Math.hypot(dx,dy);if(d<5||buildMode){arrive=true}else{vx=dx/d;vy=dy/d*(160/130)}}
  if(keys.ArrowLeft||keys.a)vx=-1;if(keys.ArrowRight||keys.d)vx=1;if(keys.ArrowUp||keys.w)vy=-1;if(keys.ArrowDown||keys.s)vy=1;
  const mv=Math.hypot(vx,vy)>0.12&&state&&!curPanel;
  if(mv){
    const m=curMe(),{W,H}=scene==='market'?WORLD.market:WORLD.farm,len=Math.max(1,Math.hypot(vx,vy));
    if(scene==='explore'){m.x+=vx/len*Math.min(1,len)*160*dt;m.y+=vy/len*Math.min(1,len)*130*dt}
    else{m.x=clamp(m.x+vx/len*Math.min(1,len)*160*dt,24,W-24);m.y=clamp(m.y+vy/len*Math.min(1,len)*130*dt,74,H-26)}
    if(moveTo){const mm=curMe();if(mm._lx!=null&&Math.hypot(mm.x-mm._lx,mm.y-mm._ly)<0.01){const fn=moveTo.then;moveTo=null;if(fn)setTimeout(fn,0)}mm._lx=mm.x;mm._ly=mm.y}
    if(Math.hypot(vx,vy)>0.15){meFace=dirIdx(vx,vy);meDir=faceFlip(meFace)?-1:1}walkPh+=dt*12;updateMe();updateCam();pushPos(false);refreshAct();
    raf=requestAnimationFrame(walkLoop);
  }else{raf=null;walkPh=0;if(state){updateMe();pushPos(true);if(scene==='farm'&&!viewing)save()}}
  if(arrive&&moveTo){const fn=moveTo.then;moveTo=null;if(fn)fn()}
}

function renderOrdersBtn(){const n=ORDERS.filter(o=>(state.orders||{})[o.k]===1).length;document.getElementById('ordersBtn').hidden=false;const bg=document.getElementById('ordersBadge');bg.hidden=!n;bg.textContent=n}
document.getElementById('ordersBtn').onclick=()=>{sheet={orders:true};renderSheet();sheetEl.classList.add('open');bd.style.display='block'};
function ordersHTML(){ensureDaily();const o=state.orders||{};const start=`<h2>入門訂單</h2><div class="tuth" style="margin-bottom:6px"><img class="gp" src="${document.querySelector('.tuth .gp').src}" width="44" height="44" alt="">農會阿伯的委託，完成後可以領取金幣。</div>`+ORDERS.map(x=>`<div class="lot"><div class="lot-name">${x.t}</div><div class="meta">獎勵 ${x.r} 金幣</div>${o[x.k]===2?'<p class="note">已領取</p>':o[x.k]===1?`<button class="btn primary" data-act="claim" data-k="${x.k}">領取 ${x.r} 金幣</button>`:'<p class="note">進行中</p>'}</div>`).join('')+'<button class="btn" data-act="close">關閉</button>';
  const dl=state.daily.list,w=state.weekly;
  return `<h2>訂單</h2><h3>今日訂單</h3><p class="note">每天換新。種出符合條件的果實後，在採收畫面按「交給訂單」。</p>`+dl.map(x=>`<div class="lot"><div class="lot-name">${condTxt(x.c)}</div><div class="meta">獎勵 ${x.r} 金幣</div><p class="note">${x.done?'已完成':'進行中'}</p></div>`).join('')+`<h3>本週挑戰</h3><div class="lot"><div class="lot-name">${condTxt(w.c)}</div><div class="meta">獎勵 ${w.r} 金幣＋${w.pt}</div><p class="note">${w.done?'已完成':'進行中（可能需要交易或探索取得素材）'}</p></div>`+(ORDERS.every(x=>o[x.k]===2)?'':start.replace('<h2>入門訂單</h2>','<h3>入門訂單</h3>'));
}
function orderAction(b){if(b.dataset.act!=='claim')return;const x=ORDERS.find(o=>o.k===b.dataset.k);if(!x||state.orders[x.k]!==1)return;state.orders[x.k]=2;state.coins+=x.r;save();renderCoins();renderOrdersBtn();renderSheet();toast(`領取了 ${x.r} 金幣`)}
let loop=null;
const loginEl=document.getElementById('login');
if(/Line\/|FBAN|FBAV|Instagram|MicroMessenger/i.test(navigator.userAgent))document.getElementById('inapp').hidden=false;
document.getElementById('loginBtn').onclick=async()=>{
  const err=document.getElementById('loginErr');err.textContent='';
  const provider=new firebase.auth.GoogleAuthProvider();
  try{await auth.signInWithPopup(provider)}
  catch(e){
    if(e.code==='auth/popup-blocked'||e.code==='auth/operation-not-supported-in-this-environment'){try{await auth.signInWithRedirect(provider)}catch(e2){err.textContent='登入失敗：'+e2.code}}
    else if(e.code==='auth/popup-closed-by-user'||e.code==='auth/cancelled-popup-request')err.textContent='登入視窗被關掉了，請再按一次登入。';
    else if(e.code==='auth/unauthorized-domain')err.textContent='這個網址還沒加入 Firebase 的授權網域。';
    else err.textContent='登入失敗：'+e.code;
  }
};
document.getElementById('logoutBtn').onclick=async()=>{await flush();leavePresence();if(viewing){viewing.unsub&&viewing.unsub();viewing=null}await auth.signOut()};
auth.onAuthStateChanged(async user=>{
  if(!user){if(selfUnsub){selfUnsub();selfUnsub=null}stopListeners();uid=null;state=null;closeSheet();loginEl.hidden=false;return}
  uid=user.uid;loginEl.hidden=true;setSync('loading');
  document.getElementById('account').textContent='目前登入：'+(user.displayName||'')+(user.email?'（'+user.email+'）':'');
  try{const rs=await db.collection('registry').get();regList=rs.docs.map(d=>({id:d.id,...d.data()})).filter(r=>r.v===4);sortReg()}catch(e){}
  let cloud=null,snap=null,readOk=false;
  for(let k=0;k<3&&!readOk;k++){try{snap=await db.collection('players').doc(uid).get();readOk=true}catch(e){await new Promise(r=>setTimeout(r,1500))}}
  if(!readOk){setSync('err');blockSaves('讀取雲端存檔失敗。為了避免用空白存檔蓋掉你的進度，遊戲先不啟動，請確認網路後重新整理。');return}
  if(snap.exists&&snap.data().save){
    const raw=snap.data().save;let o=null;try{o=unpack(raw)}catch(e){}
    if(o&&o.v===4){cloud=migrate(o);cloud._raw=raw}
    else if(o)await backupSave(raw,'v'+(o.v||0));   // 舊版本存檔：重置前先備份
  }
  const local=load();
  if(cloud&&local)state=(local.savedAt||0)>(cloud.savedAt||0)?local:cloud;else state=cloud||local;
  let repaired=null;
  if(state){const raw=state._raw||packState(state);delete state._raw;const r=repairState(state);if(repTotal(r)){await backupSave(raw,'repair'+Date.now());repaired=r}}
  if(cloud)delete cloud._raw;
  if(!state)newGame();
  ensureCrops();
  dirty=true;flush();
  db.collection('profiles').doc(uid).set({name:myName(),avatar:state.avatar||AV_DEF,at:TS()},{merge:true}).catch(()=>{});
  startListeners();startSocial();watchOwnSave();checkBuild();
  if(repaired){save();repNotice(repaired)}
  closePanel();scene='farm';viewing=null;renderHUD();renderAll();tick();tutRender();renderOrdersBtn();joinFarm(uid);renderChars();updateCam();refreshAct();
  if(!loop)loop=setInterval(tick,1000);
});
document.addEventListener('visibilitychange',()=>{if(document.hidden)flush();else tick()});
window.addEventListener('pagehide',()=>{flush()});
applyCtrl();
</script>
</body>
</html>
