<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>種子的世界 2.5D 試做：草原</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#cfe3c8;font-family:-apple-system,"PingFang TC","Noto Sans TC",sans-serif;touch-action:none;-webkit-user-select:none;user-select:none}
  canvas{display:block}
  #hud{position:fixed;left:8px;top:8px;right:8px;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none}
  .tag{background:rgba(255,250,235,.92);border:2px solid #6b4a2b;border-radius:10px;padding:4px 10px;font-size:13px;color:#4a3020;box-shadow:0 2px 0 rgba(0,0,0,.15)}
  #fps{font-variant-numeric:tabular-nums}
  #bar{position:fixed;left:4px;right:4px;bottom:calc(10px + env(safe-area-inset-bottom));display:flex;gap:5px;justify-content:center;flex-wrap:wrap}
  #bar button{pointer-events:auto;background:rgba(255,250,235,.95);border:2px solid #6b4a2b;border-radius:10px;padding:7px 7px;font-size:12px;white-space:nowrap;color:#4a3020;font-family:inherit}
  #hint{position:fixed;left:50%;top:44px;transform:translateX(-50%);transition:opacity .6s;white-space:nowrap}
  #joy{position:fixed;left:18px;bottom:calc(100px + env(safe-area-inset-bottom));width:116px;height:116px;border-radius:50%;background:rgba(255,250,235,.35);border:2px solid rgba(107,74,43,.55);touch-action:none}
  #knob{position:absolute;left:38px;top:38px;width:40px;height:40px;border-radius:50%;background:rgba(255,250,235,.95);border:2px solid #6b4a2b}
  #load{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;font-size:16px;color:#4a3020}
</style>
</head>
<body>
<div id="load">載入中…</div>
<div id="hud"><div class="tag">2.5D 試做・草原</div><div class="tag" id="fps">每秒畫 -- 次</div></div>
<div class="tag" id="hint">拖左下角的圓盤走路，或點地面走過去</div>
<div id="joy"><div id="knob"></div></div>
<div id="bar">
  <button id="bView">視角：低</button>
  <button id="bFps">60 幀</button>
  <button id="bQ">畫質：高</button>
  <button id="bImp">改善：開</button>
  <button id="bTree">樹：葉叢</button>
  <button id="bSave">省電：關</button>
</div>
<script src="../../lib/three.min.js"></script>
<script>
(function(){
'use strict';
// ---------- 世界設定 ----------
const W=80, SEG=140;
let seed=7;function rnd(){seed=(seed*16807)%2147483647;return (seed-1)/2147483646;}
const PATHS=[
  [[0,42],[0.5,28],[-2,16],[-5,4],[-4,-8],[2,-20],[7,-30],[9,-42]],
  [[-5,3],[4,-1],[14,-3],[26,-1],[42,1]]
];
const FARM={x0:-13,x1:-5,z0:3,z1:10};
const POND={x:9,z:7,r:3.6};
const PLAT=3.8;const POOL={x:18,z:-8.9,r:2.2,y:0.18};
const RV_UP_P=[[27,-30],[24.5,-24],[21,-18.5],[18.6,-14.2],[18,-12.5]];
const RV_LO_P=[[18,-8.9],[17.2,-5.6],[15.2,-3.4],[13,-1],[11.4,2.2],[10.2,4.7],[9.5,6.3]];
function segDist(px,pz,a,b){const dx=b[0]-a[0],dz=b[1]-a[1];let t=((px-a[0])*dx+(pz-a[1])*dz)/(dx*dx+dz*dz);t=Math.max(0,Math.min(1,t));const x=a[0]+t*dx,z=a[1]+t*dz;return Math.hypot(px-x,pz-z);}
// 用平滑曲線取樣路徑
function smoothPath(pts){const out=[];for(let i=0;i<pts.length-1;i++){const p0=pts[Math.max(0,i-1)],p1=pts[i],p2=pts[i+1],p3=pts[Math.min(pts.length-1,i+2)];for(let s=0;s<12;s++){const t=s/12,t2=t*t,t3=t2*t;const f=(a,b,c,d)=>0.5*((2*b)+(-a+c)*t+(2*a-5*b+4*c-d)*t2+(-a+3*b-3*c+d)*t3);out.push([f(p0[0],p1[0],p2[0],p3[0]),f(p0[1],p1[1],p2[1],p3[1])]);}}out.push(pts[pts.length-1]);return out;}
const SP=PATHS.map(smoothPath);
function pathDist(x,z){let d=1e9;for(const p of SP)for(let i=0;i<p.length-1;i++)d=Math.min(d,segDist(x,z,p[i],p[i+1]));return d;}
function samplePath(pts){const sp=smoothPath(pts);const cum=[0];for(let i=1;i<sp.length;i++)cum.push(cum[i-1]+Math.hypot(sp[i][0]-sp[i-1][0],sp[i][1]-sp[i-1][1]));return {p:sp,cum,L:cum[cum.length-1]};}
let RV_UP,RV_LO;
function loSurf(s){return POOL.y+(-0.36-POOL.y)*Math.min(1,s/RV_LO.sRim);}
function riverInfo(x,z){if(!RV_UP){RV_UP=samplePath(RV_UP_P);RV_LO=samplePath(RV_LO_P);let k=0;while(k<RV_LO.p.length-1&&Math.hypot(RV_LO.p[k][0]-POND.x,RV_LO.p[k][1]-POND.z)>POND.r+0.9)k++;RV_LO.sRim=RV_LO.cum[k];}
  let best={d:1e9,surf:0,s:0,lo:false};
  for(const [R_,lo] of [[RV_UP,false],[RV_LO,true]]){const p=R_.p;for(let i=0;i<p.length-1;i++){const a=p[i],b=p[i+1];const dx=b[0]-a[0],dz=b[1]-a[1];const L2=dx*dx+dz*dz;let t=((x-a[0])*dx+(z-a[1])*dz)/L2;t=Math.max(0,Math.min(1,t));const d=Math.hypot(x-(a[0]+t*dx),z-(a[1]+t*dz));
    if(d<best.d){const s=R_.cum[i]+t*Math.sqrt(L2);best={d,s,lo,surf:lo?loSurf(s):(PLAT-0.34)};}}}
  return best;}
function sstep(a,b,x){const t=Math.max(0,Math.min(1,(x-a)/(b-a)));return t*t*(3-2*t);}
function platMask(x,z){return sstep(-10.6,-12.4,z)*sstep(9,12.5,x);}
function rampMask(x){return sstep(25.4,27.6,x)*(1-sstep(32.2,34.4,x));}
function platH(x,z){const pm=platMask(x,z);const rt=Math.max(0,Math.min(1,(-1.2-z)/12));const rh=rampMask(x)*rt*rt*(3-2*rt);return PLAT*Math.max(pm,rh*sstep(9,12.5,x));}
function farmIn(x,z,m){return x>FARM.x0-m&&x<FARM.x1+m&&z>FARM.z0-m&&z<FARM.z1+m;}
function hgt(x,z){
  let h=0.55*Math.sin(x*0.11+1.3)*Math.cos(z*0.09-0.4)+0.3*Math.sin(x*0.23+z*0.19)+0.18*Math.cos(x*0.41-z*0.33);
  h+=4.2*Math.exp(-((x+20)**2+(z+22)**2)/160);
  h+=1.8*Math.exp(-((x-30)**2+(z-24)**2)/140);
  const pd=pathDist(x,z);
  let fl=Math.max(1-sstep(1.4,4.2,pd), farmIn(x,z,0)?1:(farmIn(x,z,2.5)?0.6:0));
  h=h*(1-fl*0.85);
  const pr=Math.hypot(x-POND.x,z-POND.z);
  h-=1.05*(1-sstep(POND.r-1.0,POND.r+2.4,pr));
  h+=platH(x,z);
  // 河道：中間比水面低、往兩岸慢慢回到原本地形
  const ri=riverInfo(x,z);
  if(ri.d<3.6){const bed=ri.surf-0.55*Math.max(0,1-(ri.d/1.35)**2)+(ri.d>1.35?(ri.d-1.35)*0.18:0);const t=sstep(1.35,3.6,ri.d);h=Math.min(h,bed*(1-t)+h*t);}
  const pd2=Math.hypot(x-POOL.x,z-POOL.z);
  if(pd2<4){const bed=POOL.y-0.6*Math.max(0,1-(pd2/POOL.r)**2)+(pd2>POOL.r?(pd2-POOL.r)*0.2:0);const t=sstep(POOL.r,4,pd2);h=Math.min(h,bed*(1-t)+h*t);}
  return h;
}

// ---------- 渲染器 ----------
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'low-power'});
let hiQ=true;
let saveMode=false,dirty=true;
function setPR(){renderer.setPixelRatio(hiQ?Math.min(window.devicePixelRatio||1,saveMode?1.5:2):1);dirty=true;}
setPR();
renderer.setSize(innerWidth,innerHeight);
renderer.outputEncoding=THREE.sRGBEncoding;
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);
const scene=new THREE.Scene();
scene.background=new THREE.Color('#cfe3c8');
scene.fog=new THREE.Fog('#d6e8cf',34,70);
const camera=new THREE.PerspectiveCamera(45,innerWidth/innerHeight,0.5,200);
scene.add(new THREE.HemisphereLight('#fff7e2','#5f7f3c',0.78));
const sun=new THREE.DirectionalLight('#fff1d6',0.72);sun.position.set(-12,22,-10);scene.add(sun);scene.add(sun.target);
sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);{const c=sun.shadow.camera;c.left=-24;c.right=24;c.top=24;c.bottom=-24;c.near=1;c.far=70;}sun.shadow.bias=-0.0006;sun.shadow.normalBias=0.03;

// ---------- 地面貼圖（程式畫） ----------
const TS=2048, cv=document.createElement('canvas');cv.width=cv.height=TS;const g=cv.getContext('2d');
const toC=(x,z)=>[(x+W/2)/W*TS,(z+W/2)/W*TS];
const PX=TS/W;
g.fillStyle='#8dbd57';g.fillRect(0,0,TS,TS);
const blot=(x,y,r,c,a)=>{const gr=g.createRadialGradient(x,y,0,x,y,r);gr.addColorStop(0,c);gr.addColorStop(1,'rgba(0,0,0,0)');g.globalAlpha=a;g.fillStyle=gr;g.beginPath();g.arc(x,y,r,0,7);g.fill();g.globalAlpha=1;};
const greens=['#7aae47','#9fcb67','#6e9f40','#a8d06f','#86b84f'];
for(let i=0;i<520;i++)blot(rnd()*TS,rnd()*TS,40+rnd()*170,greens[i%5],0.35);
// 高處偏亮、低處偏暗（假的環境光遮蔽）
for(let i=0;i<1600;i++){const x=(rnd()-0.5)*W,z=(rnd()-0.5)*W,h=hgt(x,z);const [cx,cz]=toC(x,z);if(h>1.2)blot(cx,cz,60,'#b9dc84',0.12);if(h<-0.2)blot(cx,cz,50,'#5d8c38',0.14);}
// 草葉筆觸
for(let i=0;i<26000;i++){const x=rnd()*TS,y=rnd()*TS;g.strokeStyle=rnd()<0.5?'rgba(70,110,40,.35)':'rgba(190,225,130,.35)';g.lineWidth=1.4;g.beginPath();g.moveTo(x,y);g.lineTo(x+(rnd()-0.5)*3,y-4-rnd()*5);g.stroke();}
// 池塘底
{const [cx,cz]=toC(POND.x,POND.z);blot(cx,cz,(POND.r+2.2)*PX,'#c9b07a',0.9);blot(cx,cz,(POND.r+0.6)*PX,'#4f7d5a',1);}
// 農田
{const [ax,az]=toC(FARM.x0,FARM.z0),[bx,bz]=toC(FARM.x1,FARM.z1);
 g.save();g.shadowColor='rgba(80,50,25,.6)';g.shadowBlur=28;g.fillStyle='#8b5d38';g.fillRect(ax,az,bx-ax,bz-az);g.restore();
 for(let z=az+14;z<bz-6;z+=PX*1.5){g.fillStyle='#6f4628';g.fillRect(ax+10,z,bx-ax-20,PX*0.45);g.fillStyle='rgba(180,130,85,.6)';g.fillRect(ax+10,z-PX*0.25,bx-ax-20,PX*0.18);}
 for(let i=0;i<1500;i++){g.fillStyle=rnd()<0.5?'rgba(60,35,18,.45)':'rgba(170,125,80,.45)';g.fillRect(ax+rnd()*(bx-ax),az+rnd()*(bz-az),2,2);}
}
// 泥土路（多層描邊做出柔和邊緣）
g.lineCap=g.lineJoin='round';
const layers=[];for(let w=4.6;w>2.2;w-=0.12)layers.push([w,'rgba(190,150,98,.10)']);layers.push([2.3,'rgba(192,148,92,.55)']);
for(const [w,c] of layers){g.strokeStyle=c;g.lineWidth=w*PX;for(const p of SP){g.beginPath();p.forEach((q,i)=>{const [x,z]=toC(q[0],q[1]);i?g.lineTo(x,z):g.moveTo(x,z);});g.stroke();}}
for(let i=0;i<9000;i++){const x=(rnd()-0.5)*W,z=(rnd()-0.5)*W;const d=pathDist(x,z);if(d<1.5){const [cx,cz]=toC(x,z);g.fillStyle=rnd()<0.5?'rgba(120,85,50,.5)':'rgba(235,210,160,.5)';g.beginPath();g.arc(cx,cz,1+rnd()*2.4,0,7);g.fill();}else if(d<2.1&&rnd()<0.5){const [cx,cz]=toC(x,z);g.fillStyle='rgba(120,170,70,.8)';g.beginPath();g.arc(cx,cz,2+rnd()*3,0,7);g.fill();}}
// 河岸、瀑布潭、懸崖岩壁
{const strokeR=(R_,w,c)=>{g.strokeStyle=c;g.lineWidth=w*PX;g.beginPath();R_.p.forEach((q,i)=>{const [x,z]=toC(q[0],q[1]);i?g.lineTo(x,z):g.moveTo(x,z);});g.stroke();};
 riverInfo(0,0);
 for(const R_ of [RV_UP,RV_LO]){for(let w=6.2;w>3.6;w-=0.2)strokeR(R_,w,'rgba(70,100,45,.06)');for(let w=4.4;w>3.0;w-=0.15)strokeR(R_,w,'rgba(190,170,125,.10)');strokeR(R_,3.0,'rgba(176,156,112,.85)');strokeR(R_,2.4,'#5b7f62');}
 const [px_,pz_]=toC(POOL.x,POOL.z);blot(px_,pz_,(POOL.r+1.6)*PX,'#b8a678',0.9);blot(px_,pz_,(POOL.r+0.3)*PX,'#4f7a63',1);
 for(let i=0;i<2400;i++){const x=(rnd()-0.5)*W,z=(rnd()-0.5)*W;const ri=riverInfo(x,z);if(ri.d>1.2&&ri.d<2.2){const [cx,cz]=toC(x,z);g.fillStyle=['#9c9480','#b9b29c','#7f7a6a'][(rnd()*3)|0];g.beginPath();g.ellipse(cx,cz,1.6+rnd()*2.6,1.2+rnd()*1.8,rnd()*3,0,7);g.fill();}}
 const step=W/360;for(let gx=8;gx<W/2;gx+=step)for(let gz=-14;gz<-9;gz+=step){const gr=Math.hypot(hgt(gx+0.25,gz)-hgt(gx-0.25,gz),hgt(gx,gz+0.25)-hgt(gx,gz-0.25))/0.5;
   if(gr>0.9&&platMask(gx,gz)>0.02&&platMask(gx,gz)<0.99){const [cx,cz]=toC(gx,gz);const hh=hgt(gx,gz);const nz=Math.sin(gx*3.1)*Math.cos(gz*2.3)+Math.sin(gx*7.3+hh*3.0)*0.5;const band=nz>0.4?2:(nz<-0.4?1:0);g.fillStyle=['#a39377','#8f8167','#b5a688'][band];g.fillRect(cx-PX*step*0.6,cz-PX*step*0.6,PX*step*1.2,PX*step*1.2);
     if(rnd()<0.08){g.fillStyle='rgba(60,50,35,.45)';g.fillRect(cx-4,cz,8,1.5);} if(rnd()<0.05){g.fillStyle='rgba(110,150,70,.7)';g.beginPath();g.arc(cx,cz,2.5,0,7);g.fill();}}}
}
// 小花、小石子
const fl=['#fffaf0','#ffe066','#f7b6c9','#c9d8ff','#ffffff'];
for(let i=0;i<3600;i++){const x=(rnd()-0.5)*W,z=(rnd()-0.5)*W;if(pathDist(x,z)<2.2||farmIn(x,z,1)||Math.hypot(x-POND.x,z-POND.z)<POND.r+2||riverInfo(x,z).d<2.6||Math.hypot(x-POOL.x,z-POOL.z)<POOL.r+1.5)continue;const [cx,cz]=toC(x,z);
  if(rnd()<0.86){const c=fl[(rnd()*5)|0];const cl=rnd()<0.3?3:1;for(let k=0;k<cl;k++){g.fillStyle=c;g.beginPath();g.arc(cx+(rnd()-0.5)*12,cz+(rnd()-0.5)*12,1.1+rnd()*1.2,0,7);g.fill();}}
  else{g.fillStyle='#9a9a8a';g.beginPath();g.ellipse(cx,cz,2+rnd()*2.4,1.4+rnd()*1.6,0,0,7);g.fill();g.fillStyle='rgba(255,255,255,.35)';g.beginPath();g.arc(cx-1,cz-1,1.4,0,7);g.fill();}}
const groundTex=new THREE.CanvasTexture(cv);groundTex.encoding=THREE.sRGBEncoding;groundTex.anisotropy=renderer.capabilities.getMaxAnisotropy();

// ---------- 地形 ----------
const geo=new THREE.PlaneGeometry(W,W,SEG,SEG);geo.rotateX(-Math.PI/2);
const pos=geo.attributes.position;
for(let i=0;i<pos.count;i++){pos.setY(i,hgt(pos.getX(i),pos.getZ(i)));}
geo.computeVertexNormals();
const ground=new THREE.Mesh(geo,new THREE.MeshLambertMaterial({map:groundTex}));
ground.receiveShadow=true;scene.add(ground);
// 水面
// （水面見下方「水：河流、瀑布、池塘」）

// ---------- 水：河流、瀑布、池塘（自訂著色器，和地面同一套霧） ----------
const NOISE=`float hsh(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}
float vn(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);return mix(mix(hsh(i),hsh(i+vec2(1,0)),f.x),mix(hsh(i+vec2(0,1)),hsh(i+vec2(1,1)),f.x),f.y);}
float fbm(vec2 p){return vn(p)*.55+vn(p*2.07+1.7)*.3+vn(p*4.3+3.1)*.15;}`;
const W_VS=`varying vec2 vUv;varying vec3 vW;varying float vFog;void main(){vUv=uv;vec4 w=modelMatrix*vec4(position,1.);vW=w.xyz;vec4 mv=viewMatrix*w;vFog=-mv.z;gl_Position=projectionMatrix*mv;}`;
// 水的外觀只看「這一點的水有多深」（由地形算出的深度圖），所以不同水面在交界處長得一模一樣，岸邊自然淡出
const W_FS=`uniform float uTime,uNear,uFar,uMode,uSpeed,uW;uniform sampler2D uDepth;uniform vec3 uFogC,uImp;uniform vec4 uFade;varying vec2 vUv;varying vec3 vW;varying float vFog;`+NOISE+`
void main(){float dep=texture2D(uDepth,(vW.xz+uW*.5)/uW).r;if(dep<0.004)discard;
 vec2 wq=vW.xz*.45+vec2(uTime*.05,uTime*.035);
 vec2 q=uMode<0.5?vec2(vUv.x*3.5,vUv.y*.8-uTime*uSpeed):wq;
 float n=fbm(q),n2=fbm(q*vec2(2.,1.7)+vec2(5.,-uTime*uSpeed*.6));
 float edge=smoothstep(0.,.3,dep);
 vec3 sh=vec3(.60,.86,.83),dp=vec3(.24,.55,.70);vec3 c=mix(sh,dp,smoothstep(.03,.4,dep));
 c+=vec3(.07,.09,.09)*(n-.5);
 float ln=smoothstep(.64,.68,n2)*(1.-smoothstep(.68,.74,n2));c=mix(c,vec3(.92,.98,1.),ln*.45*smoothstep(.08,.35,dep));
 float sp=step(.93,vn(q*9.+vec2(0.,uTime*1.3)))*smoothstep(.15,.5,dep);c+=sp*.35;
 float foam=1.-smoothstep(.0,.05+.05*n,dep);
 if(uImp.z>0.){float di=distance(vW.xz,uImp.xy);foam=max(foam,(1.-smoothstep(0.,uImp.z,di+(n-.5)*.9)));}
 c=mix(c,vec3(.96,.99,1.),foam*.8);
 float a=smoothstep(.0,.04,dep)*mix(.8,.95,edge);
 if(uFade.w>0.){a*=smoothstep(uFade.x,uFade.y,vUv.y)*(1.-smoothstep(uFade.z,uFade.w,vUv.y));}
 c=mix(c,uFogC,smoothstep(uNear,uFar,vFog));gl_FragColor=vec4(c,a);}`;
const F_FS=`uniform float uTime,uNear,uFar;uniform vec3 uFogC;varying vec2 vUv;varying vec3 vW;varying float vFog;`+NOISE+`
void main(){float u=vUv.x,v=vUv.y;float n=fbm(vec2(u*7.,v*2.6-uTime*2.3));float n2=fbm(vec2(u*14.+3.,v*4.5-uTime*3.));
 vec3 c=mix(vec3(.52,.78,.86),vec3(.90,.97,1.),smoothstep(.42,.72,n));c=mix(c,vec3(1.),smoothstep(.68,.78,n2)*.65);
 float lip=1.-smoothstep(0.,.1,v),bot=smoothstep(.72,1.,v);c=mix(c,vec3(.97,.99,1.),max(lip*.75,bot*.85));
 float side=smoothstep(0.,.14+.06*n,u)*(1.-smoothstep(.86-.06*n,1.,u));float a=(.80+.2*n)*side;
 c=mix(c,uFogC,smoothstep(uNear,uFar,vFog));gl_FragColor=vec4(c,a);}`;
const U_DEPTH={value:null};

// 點擊位置的小圈
const mc=document.createElement('canvas');mc.width=mc.height=64;{const c=mc.getContext('2d');c.strokeStyle='rgba(255,250,220,.95)';c.lineWidth=5;c.beginPath();c.arc(32,32,24,0,7);c.stroke();}
const marker=new THREE.Mesh(new THREE.PlaneGeometry(1.1,1.1),new THREE.MeshBasicMaterial({map:new THREE.CanvasTexture(mc),transparent:true,depthWrite:false}));marker.rotation.x=-Math.PI/2;marker.visible=false;scene.add(marker);let markerT=0;

// ---------- 鏡頭 ----------
const VIEWS=[['低',38,30],['中',50,32],['高',64,36]];let vi=0;
const camT=new THREE.Vector3(10,0,-5);
function placeCam(){const [,p,d]=VIEWS[vi];if(p!==pitchNow){pitchNow=p;orientAll();}const pr=p*Math.PI/180;camera.position.set(camT.x,camT.y+Math.sin(pr)*d,camT.z+Math.cos(pr)*d);camera.lookAt(camT);}
document.getElementById('bView').onclick=()=>{vi=(vi+1)%3;dirty=true;document.getElementById('bView').textContent='視角：'+VIEWS[vi][0];};
let treeMode=0;const TM=['葉叢','圓團','2D'];
document.getElementById('bTree').onclick=e=>{dirty=true;if(saveMode)renderer.shadowMap.needsUpdate=true;treeMode=(treeMode+1)%3;LEAFMODE=treeMode===0;tree3D=treeMode<2;
  while(G3.children.length)G3.remove(G3.children[0]);if(tree3D){seed=11;build3D();}G3.visible=tree3D;orientAll();e.target.textContent='樹：'+TM[treeMode];};
document.getElementById('bImp').onclick=e=>{improve=!improve;orientAll();dirty=true;e.target.textContent='改善：'+(improve?'開':'關');};
let cap60=true;document.getElementById('bFps').onclick=e=>{cap60=!cap60;e.target.textContent=cap60?'60 幀':'30 幀';};
document.getElementById('bQ').onclick=e=>{hiQ=!hiQ;setPR();e.target.textContent='畫質：'+(hiQ?'高':'低');};
addEventListener('resize',()=>{dirty=true;camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});

// ---------- 更新 ----------
let face='front',walkT=0,lastDir=1;

function update(dt,t){
  // 玩家
  let vx=0,vz=0;
  if(keys.ArrowLeft||keys.a)vx-=1;if(keys.ArrowRight||keys.d)vx+=1;if(keys.ArrowUp||keys.w)vz-=1;if(keys.ArrowDown||keys.s)vz+=1;
  if(Math.hypot(jv[0],jv[1])>0.2){vx=jv[0];vz=jv[1];}
  if(vx||vz){tgt=null;marker.visible=false;}
  else if(tgt){const dx=tgt[0]-player.x,dz=tgt[1]-player.z,d=Math.hypot(dx,dz);if(d<0.15){tgt=null;marker.visible=false;}else{vx=dx/d;vz=dz/d;}}
  const sp=4.2,l=Math.hypot(vx,vz);
  let px=player.x,pz=player.z,bob=0;
  if(l>0){vx/=l;vz/=l;let nx=px+vx*sp*dt,nz=pz+vz*sp*dt;if(blocked(nx,nz)){nx=px;nz=pz;tgt=null;}
    nx=Math.max(-W/2+2,Math.min(W/2-2,nx));nz=Math.max(-W/2+2,Math.min(W/2-2,nz));px=nx;pz=nz;walkT+=dt;bob=Math.abs(Math.sin(walkT*11))*0.07;
    if(Math.abs(vx)>Math.abs(vz)*1.2){setTex(player,TEX.char_side,vx<0);}
    else if(vz<0){setTex(player,TEX.char_back,false);}
    else{setTex(player,(Math.floor(walkT*6)%2)?TEX.char_walk:TEX.char_front,false);}
  }else{walkT=0;if(player.m.material.uniforms.map.value===TEX.char_walk)setTex(player,TEX.char_front,false);}
  placeBB(player,px,pz,bob);
  // 怪物：停一下、走一段
  for(const m of mons){const u=m.mon;u.t+=dt;let x=m.x,z=m.z,b=0;
    if(u.wait>0){u.wait-=dt;}else{const dx=u.tx-x,dz=u.tz-z,d=Math.hypot(dx,dz);if(d<0.1){u.wait=1+rnd()*2.5;let a=rnd()*6.28,r=rnd()*4;u.tx=u.home[0]+Math.cos(a)*r;u.tz=u.home[1]+Math.sin(a)*r;}else{x+=dx/d*1.3*dt;z+=dz/d*1.3*dt;b=Math.abs(Math.sin(u.t*9))*0.12;m.m.material.uniforms.uFlip.value=dx>0?1:0;}}
    placeBB(m,x,z,b);}
  for(const m of MIST){const ph=(t*0.35+m.userData.ph)%1;m.position.set(POOL.x+m.userData.ox*(0.6+ph*0.6),POOL.y+0.3+ph*1.8,POOL.z-1.0+ph*0.4);m.scale.setScalar(1.2+ph*2.2);m.material.opacity=0.45*(1-ph)*Math.min(1,ph*5);}
  if(marker.visible){markerT+=dt;marker.material.opacity=0.6+0.4*Math.sin(markerT*8);}
  // 鏡頭跟隨
  const cx=Math.max(-W/2+10,Math.min(W/2-10,px)),cz=Math.max(-W/2+6,Math.min(W/2-8,pz));
  camT.x+=(cx-camT.x)*Math.min(1,dt*4);camT.z+=(cz-camT.z)*Math.min(1,dt*4);camT.y+=(hgt(camT.x,camT.z)-camT.y)*Math.min(1,dt*3);
  placeCam();
  lodT+=dt;if(lodT>0.25){lodT=0;for(const L of LOD){const near=Math.hypot(L.x-camT.x,(L.z-camT.z)*0.8)<24;if(near!==L.near){L.near=near;L.md.visible=near;L.ms.visible=!near;dirty=true;if(saveMode)renderer.shadowMap.needsUpdate=true;}}}
  if(!saveMode){sun.position.set(camT.x-12,camT.y+22,camT.z-10);sun.target.position.copy(camT);}
  // 有沒有東西在動：沒有就不用重畫
  let sig=px*7.1+pz*3.3+bob*11+camT.x*5.7+camT.z*2.9+camT.y+(marker.visible?markerT:0);for(const m of mons)sig+=m.m.position.x*1.3+m.m.position.y*7+m.m.position.z*0.7;
  if(Math.abs(sig-lastSig)>1e-4){dirty=true;lastSig=sig;}
}
let lastSig=0;
// ---------- 省電模式 ----------
function setShadowArea(big){const c=sun.shadow.camera;const r=big?44:24;c.left=-r;c.right=r;c.top=r;c.bottom=-r;c.updateProjectionMatrix();sun.shadow.mapSize.set(big?2048:1024,big?2048:1024);if(sun.shadow.map){sun.shadow.map.dispose();sun.shadow.map=null;}}
function applySave(){SW.value=saveMode?0:1;orientAll();setPR();
  if(saveMode){setShadowArea(true);sun.position.set(-12,24,-10);sun.target.position.set(0,0,0);sun.target.updateMatrixWorld();renderer.shadowMap.autoUpdate=false;renderer.shadowMap.needsUpdate=true;}
  else{setShadowArea(false);renderer.shadowMap.autoUpdate=true;}
  dirty=true;}
document.getElementById('bSave').onclick=e=>{saveMode=!saveMode;applySave();e.target.textContent='省電：'+(saveMode?'開':'關');};

// ---------- 迴圈 ----------
let last=performance.now(),acc=0,frames=0,fpsT=0,run=true,draws=0,lastWater=0;
const fpsEl=document.getElementById('fps');
function loop(now){if(!run)return;requestAnimationFrame(loop);let dt=(now-last)/1000;
  if((!cap60||saveMode)&&dt<1/31)return;last=now;dt=Math.min(dt,0.05);
  UT.value=now/1000;update(dt,now/1000);
  if(saveMode&&now-lastWater>83){dirty=true;lastWater=now;}
  if(!saveMode||dirty){renderer.render(scene,camera);draws++;dirty=false;}
  frames++;fpsT+=dt;if(fpsT>=1){fpsEl.textContent='每秒畫 '+Math.round(draws/fpsT)+' 次';frames=0;draws=0;fpsT=0;}}
document.addEventListener('visibilitychange',()=>{run=!document.hidden;if(run){last=performance.now();requestAnimationFrame(loop);}});
loadAll(()=>{buildWater();build();pitchNow=-1;placeCam();document.getElementById('load').remove();requestAnimationFrame(loop);});
})();
</script>
</body>
