<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>種子袋布袋</title><style>
:root{
  --bg:#E6EDDC;--paper:#FAFCF5;--ink:#25311E;--muted:#5D6A53;--line:#CBD5BD;
  --soilTop:#9B6B45;--soil:#7A5236;--soil2:#5C3D27;--grass:#9DC27B;--grass2:#7FA660;--grass3:#6A8F4E;
  --leaf:#3F7B38;--mustard:#D8A42C;--water:#3F86C4;--danger:#B4452F;--chip:#EDF2E4;--accent:#3F7B38;--onAccent:#FFFFFF;
  color-scheme:light;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1A2016;--paper:#232B1E;--ink:#E5ECDA;--muted:#A3AF94;--line:#3A4632;
    --soilTop:#80583A;--soil:#664530;--soil2:#4B3222;--grass:#5E7D46;--grass2:#4C6738;--grass3:#3E552E;
    --leaf:#78B866;--mustard:#E6B84D;--water:#6AA8DE;--danger:#E58069;--chip:#2D3727;--accent:#78B866;--onAccent:#14200F;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#1A2016;--paper:#232B1E;--ink:#E5ECDA;--muted:#A3AF94;--line:#3A4632;
  --soilTop:#80583A;--soil:#664530;--soil2:#4B3222;--grass:#5E7D46;--grass2:#4C6738;--grass3:#3E552E;
  --leaf:#78B866;--mustard:#E6B84D;--water:#6AA8DE;--danger:#E58069;--chip:#2D3727;--accent:#78B866;--onAccent:#14200F;
  color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;font-size:16px;line-height:1.6;-webkit-tap-highlight-color:transparent}
main{max-width:480px;margin:0 auto;padding:16px 16px 110px}
header{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:8px}
h1{font-family:"Noto Serif TC","Songti TC",serif;font-size:26px;line-height:1.2;margin:0;letter-spacing:.04em}
.sub{font-size:13px;color:var(--muted);margin:2px 0 0}
.coins{display:flex;align-items:center;gap:6px;background:var(--paper);border:1px solid var(--line);border-radius:999px;padding:4px 12px 4px 6px;font-weight:500;white-space:nowrap}
.coin{width:22px;height:22px;background:url(assets/icons/s/coin.png) center/contain no-repeat}/* 14x 金幣圖示 */
#farm{width:100%;height:auto;display:block;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.tools{display:flex;gap:12px;justify-content:center;margin:10px 0 4px}
.tool{display:flex;flex-direction:column;align-items:center;gap:2px;background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:6px 16px;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;cursor:grab;font-size:13px}
#ghost{position:fixed;left:0;top:0;pointer-events:none;z-index:50;display:none;transform:translate(-50%,-115%);text-align:center}
#ghost .gl{display:block;background:var(--ink);color:var(--paper);font-size:12px;border-radius:999px;padding:2px 8px;white-space:nowrap;margin-top:2px}
.mini{border:1px solid var(--line);background:var(--chip);border-radius:8px;padding:0 8px;font-size:13px;margin-left:4px;vertical-align:middle}
.rename{display:flex;gap:4px;align-items:center;flex-wrap:wrap}
.rename input{font:inherit;width:8.5em;padding:4px 8px;border:1px solid var(--line);border-radius:8px;background:var(--paper);color:var(--ink)}
.err{color:var(--danger);font-size:13px}
#farm [data-plot]{cursor:pointer}
.hint{text-align:center;color:var(--muted);font-size:14px;margin:4px 0 0;min-height:22px}
h2{font-family:"Noto Serif TC","Songti TC",serif;font-size:20px;margin:8px 0 12px}
.lot{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:12px}
.lot-top{display:flex;gap:12px;align-items:center}
.lot-name{font-weight:700;font-size:17px}
.meta{font-size:13px;color:var(--muted)}
.sims{display:flex;gap:4px;align-items:center;margin-top:8px;flex-wrap:wrap}
.sims .lbl{font-size:12px;color:var(--muted);width:100%}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--paper);border-top:1px solid var(--line);display:flex;justify-content:center;gap:8px;padding:8px 16px calc(8px + env(safe-area-inset-bottom,0px));z-index:20}
nav button{flex:1;max-width:220px;border:0;background:transparent;color:var(--muted);font:inherit;font-weight:500;padding:8px;border-radius:10px}
nav button[aria-current="page"]{background:var(--chip);color:var(--ink)}
button{font:inherit;color:inherit}
.btn{display:block;width:100%;border:1px solid var(--line);background:var(--paper);border-radius:12px;padding:12px;font-weight:500;margin-top:8px;text-align:center}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--onAccent)}
.btn.warn{color:var(--danger)}
.btn:disabled{opacity:.5}
.btn:focus-visible,nav button:focus-visible{outline:3px solid var(--mustard);outline-offset:2px}
.row2{display:flex;gap:8px}.row2 .btn{flex:1}
#backdrop{position:fixed;inset:0;background:rgba(10,20,5,.45);display:none;z-index:30}
#sheet{position:fixed;left:0;right:0;bottom:0;max-height:86vh;overflow-y:auto;background:var(--paper);border-radius:20px 20px 0 0;padding:8px 18px calc(18px + env(safe-area-inset-bottom,0px));z-index:31;transform:translateY(105%);transition:transform .22s ease}
#sheet.open{transform:none}
@media (prefers-reduced-motion: reduce){#sheet{transition:none}}
.grip{width:40px;height:4px;border-radius:2px;background:var(--line);margin:4px auto 10px}
.sheet-wrap{max-width:480px;margin:0 auto}
.stage{font-size:13px;color:var(--muted)}
.bar{height:10px;background:var(--chip);border-radius:6px;overflow:hidden;margin:6px 0}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:6px}
.stat{display:grid;grid-template-columns:5.5em 1fr 3.4em;gap:8px;align-items:center;font-size:14px;margin:4px 0}
.stat .v{text-align:right;font-weight:500;font-variant-numeric:tabular-nums}
.stat .bar{margin:0}
.chip.leg,.tg.leg{background:linear-gradient(110deg,#FFE8A3,#F6C445 40%,#FFF4C8 50%,#F6C445 60%,#FFE8A3);background-size:250% 100%;color:#6A4A00;border:1px solid #C9971C;box-shadow:0 0 6px rgba(246,196,69,.6);font-weight:700}
.chip.myth,.tg.myth{background:linear-gradient(110deg,#FF9A9A,#FFC56B,#FFF07A,#8EE58A,#7EC8FF,#B99BFF,#FF9A9A);background-size:300% 100%;color:#3A1F5C;border:1px solid #8E5CC8;box-shadow:0 0 8px rgba(185,155,255,.75);font-weight:700}
.tg{border-radius:999px;padding:0 6px}
@media (prefers-reduced-motion:no-preference){.chip.leg,.tg.leg{animation:tgshine 2.4s linear infinite}.chip.myth,.tg.myth{animation:tgshine 3s linear infinite}}
@keyframes tgshine{from{background-position:0% 50%}to{background-position:250% 50%}}
.intro{margin:2px auto 8px;max-width:320px;text-align:center;font-size:13px;font-weight:700;color:#6A4A00;background:linear-gradient(90deg,#FFF4C8,#FFE08A,#FFF4C8);border:1px solid #D9A62E;border-radius:10px;padding:4px 10px}
.slot .obs{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(70,70,70,.5);color:#fff;font-style:normal;font-size:12px;font-weight:700;pointer-events:none}
.badge.obs{background:#888;color:#fff}
.sztab{width:100%;font-size:13px;border-collapse:collapse;margin:4px 0 8px}.sztab td{padding:3px 4px;border-bottom:1px solid rgba(0,0,0,.08)}.sztab td:last-child{text-align:right;white-space:nowrap}
.lotrow.sel{outline:3px solid #D9473A;background:#FFE9E4;position:relative}
.selmk{position:absolute;right:8px;top:6px;background:#D9473A;color:#fff;border-radius:50%;width:24px;height:24px;display:flex;align-items:center;justify-content:center;font-weight:700}
.selbar{position:sticky;top:0;z-index:3;background:#FFF6E0;border:2px solid #E0A82E;border-radius:12px;padding:8px;margin:6px 0}
.selrow{display:flex;gap:6px;flex-wrap:wrap}.selrow .btn{flex:1;min-width:120px;margin:0}
.chip.xbig{background:linear-gradient(135deg,#FF8A3D,#E2381F);color:#fff;font-weight:800;border:1px solid #A8261A;box-shadow:0 0 8px rgba(226,56,31,.55);font-size:15px}
.chip.xmini{background:linear-gradient(135deg,#BDE8FF,#6FB8F0);color:#0E3E66;font-weight:800;border:1px solid #3E86C4;box-shadow:0 0 6px rgba(111,184,240,.6);font-size:11px}
.chip.xperf{background:linear-gradient(110deg,#FFFFFF,#FFF3B0 35%,#FFFFFF 50%,#FFE27A 65%,#FFFFFF);background-size:250% 100%;color:#7A5200;font-weight:800;border:1px solid #E3B23C;box-shadow:0 0 10px rgba(255,226,122,.9)}
.chip.xweird{background:linear-gradient(135deg,#9B6BFF,#3CC7B4);color:#fff;font-weight:800;border:1px solid #5A3FA8;box-shadow:0 0 8px rgba(155,107,255,.6)}
@media (prefers-reduced-motion:no-preference){.chip.xbig{animation:xpulse 1.6s ease-in-out infinite}.chip.xmini{animation:xbob 1.4s ease-in-out infinite}.chip.xperf{animation:tgshine 2s linear infinite}.chip.xweird{animation:xwob 1.8s ease-in-out infinite}}
@keyframes xpulse{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}
@keyframes xbob{0%,100%{transform:translateY(0)}50%{transform:translateY(-2px)}}
@keyframes xwob{0%,100%{transform:skewX(0) rotate(0)}25%{transform:skewX(-8deg) rotate(-2deg)}75%{transform:skewX(8deg) rotate(2deg)}}
.gcard{background:#FFF8E8;border:2px solid #E3C38A;border-radius:12px;padding:10px 12px;margin:8px 0}
.gcard h3{margin:0 0 6px;font-size:16px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}.gcard h4{margin:8px 0 4px;font-size:13px;color:#8A5A2B}.gcard p{margin:4px 0}
.ladder{display:flex;flex-wrap:wrap;align-items:flex-start;gap:2px 2px;margin:4px 0}
.lstep{display:flex;flex-direction:column;align-items:center;min-width:40px;max-width:64px;font-size:11px;text-align:center;line-height:1.25}
.lstep small{font-size:11px;margin-top:2px}.lstep svg{width:40px;height:42px}
.sw{display:block;width:30px;height:30px;border-radius:50%;border:2px solid rgba(0,0,0,.25);box-shadow:inset 0 -3px 0 rgba(0,0,0,.12)}
.sw.unk{background:radial-gradient(circle at 35% 30%,#7A7A7A,#262626);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px}
.gt{font-size:20px;font-weight:800;color:#B07A44;align-self:center;margin-top:-12px;padding:0 1px}
.gop{font-size:18px;font-weight:800;color:#8A5A2B;align-self:center;margin-top:-12px}
.mixes{display:flex;flex-wrap:wrap;gap:6px 14px}.mix{display:flex;align-items:flex-start;gap:2px}
.gdom,.grec,.gadd{display:inline-block;font-size:12px;font-weight:700;border-radius:999px;padding:1px 8px;color:#fff}
.gdom{background:#D9473A}.grec{background:#4A86D8}.gadd{background:#6E9E3A}
.glegend{display:flex;flex-wrap:wrap;gap:6px 12px;margin-top:6px;font-size:13px}
.chips{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:6px 0 10px}
.chip{background:var(--chip);border-radius:999px;padding:2px 10px;font-size:13px}
.scores{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.score{background:var(--chip);border-radius:12px;padding:8px;text-align:center}
.score b{display:block;font-size:20px;font-variant-numeric:tabular-nums}
.score span{font-size:12px;color:var(--muted)}
.badges{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.badge{font-size:13px;border:1px solid var(--line);border-radius:999px;padding:1px 10px}
.badge.r1{border-color:#5E9BC8}.badge.r2{border-color:#9B6CC8}.badge.r3{border-color:var(--mustard);font-weight:700}.badge.r4{border-color:#E0823D;background:#FFF1DE;font-weight:700}.badge.r5{border-color:#C2558F;background:linear-gradient(90deg,#FFE3EE,#E3F0FF);font-weight:700}
.silh svg{filter:brightness(0);opacity:.35}
.dexq{display:flex;gap:6px;margin:4px 0}.dexq input{flex:1;min-width:0}
.vq{display:grid;grid-template-columns:1fr 1fr;gap:6px 10px;margin:6px 0}.vq label{display:flex;flex-direction:column;font-size:13px;color:#5A3416}.vq select,.vq input{font-size:15px;min-width:0}
.vres .meta{display:block;margin:-4px 0 8px 8px}
.avdirs{display:flex;justify-content:center;gap:2px;margin:-4px 0 6px}
.seedic{position:relative;display:inline-flex;flex:none}.seedic i{position:absolute;left:50%;bottom:-2px;transform:translateX(-50%);white-space:nowrap;font-style:normal;font-size:10px;background:#FFF6DE;border:1px solid #E2C796;border-radius:8px;padding:0 4px;color:#5A3416}
.dist{border:2px solid #E2C796;border-radius:12px;background:#FFFDF6;padding:6px 10px;margin:8px 0}.dist summary{font-weight:700;color:#5A3416;cursor:pointer}
.prow{display:flex;align-items:center;gap:8px;padding:3px 0;border-top:1px dashed #EAD9B4}.prow .pl{flex:1;display:flex;flex-direction:column;font-size:14px;line-height:1.3}.prow .pp{font-weight:700;color:#5A3416;font-size:14px}
.hero{display:flex;justify-content:center}
.pick{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:1px solid var(--line);background:var(--paper);border-radius:12px;padding:8px 10px;margin-top:8px}
.pick .meta{display:block}
.note{font-size:13px;color:var(--muted)}
#toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:8px 16px;border-radius:999px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:40;max-width:90vw;text-align:center}
#toast.show{opacity:1}
.settings{margin-top:24px;border-top:1px solid var(--line);padding-top:12px}
#login{position:fixed;inset:0;background:var(--bg);z-index:60;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center}
#login[hidden]{display:none}
#login h1{font-size:34px;margin-bottom:6px}
#login .btn{max-width:320px}
.sync{font-size:12px;color:var(--muted);text-align:right;margin-top:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

.filters{display:flex;gap:6px;overflow-x:auto;padding:2px 0 10px;-webkit-overflow-scrolling:touch}
.fchip{border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:4px 12px;white-space:nowrap;font-size:14px;flex:none}
.fchip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--onAccent)}
h3{font-family:"Noto Serif TC","Songti TC",serif;font-size:17px;margin:16px 0 8px}
.sellbox label{display:block;font-size:14px;margin-top:8px}
.sellbox input,.regbox input{display:block;width:100%;font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--paper);color:var(--ink);margin-top:4px}
.regbox{background:var(--chip);border-radius:12px;padding:10px 12px;margin:12px 0}
nav button{padding:8px 2px;font-size:15px}
#farmWrap,.farmWrap{overflow-x:auto;overflow-y:hidden;border-radius:16px;-webkit-overflow-scrolling:touch}
#farmWrap{touch-action:none}
.farmWrap.v{touch-action:pan-x}
#farm,.farmsvg{width:322%;max-width:none;height:auto;display:block}
.modes{display:flex;gap:6px;margin:4px 0 8px;align-items:center}
.modes .fchip{font-size:14px}
.modes .sp{flex:1}
#farmBox{position:relative}
#joy{position:absolute;left:10px;bottom:10px;width:104px;height:104px;border-radius:50%;background:rgba(255,255,255,.35);border:2px solid rgba(0,0,0,.15);touch-action:none;z-index:5}
#joyKnob{position:absolute;left:50%;top:50%;width:44px;height:44px;margin:-22px 0 0 -22px;border-radius:50%;background:var(--paper);border:2px solid var(--line);box-shadow:0 2px 6px rgba(0,0,0,.2);pointer-events:none}

#visitBar{display:flex;align-items:center;gap:8px;background:var(--chip);border-radius:12px;padding:6px 10px;margin-bottom:8px;font-size:14px}
#visitBar[hidden]{display:none}
#visitBar span{flex:1}
.decorItems{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px}
.ditem{flex:none;display:flex;flex-direction:column;align-items:center;font-size:12px;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:4px 6px;width:70px}
.ditem[aria-pressed="true"]{border:2px solid var(--mustard)}
.avrow{display:grid;grid-template-columns:5.5em 1fr;align-items:center;gap:6px;margin:6px 0}
.avrow b{text-align:center;font-weight:500}
.avrow:has(b){grid-template-columns:5.5em auto 1fr auto}
.avsw{display:flex;flex-wrap:wrap;gap:6px;min-width:0}
.swatch{width:28px;height:28px;border-radius:50%;border:2px solid var(--line)}
.swatch[aria-pressed="true"]{border:3px solid var(--ink)}
#tut{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(70px + env(safe-area-inset-bottom,0px));width:min(460px,calc(100vw - 24px));background:var(--paper);border:2px solid var(--mustard);border-radius:16px;padding:10px 12px;z-index:25;box-shadow:0 4px 14px rgba(0,0,0,.18)}
#tut[hidden]{display:none}
.tuth{display:flex;align-items:center;gap:8px;font-weight:700}
.tuth .gp{width:44px;height:44px;border-radius:50%;border:2px solid #5A3416;background:#fff;flex:none}
.tuth .stp{margin-left:auto;font-size:12px;color:var(--muted);font-weight:400}
#tutText{margin:6px 0;font-size:15px;white-space:pre-line}
.tutb{display:flex;gap:8px;justify-content:flex-end}
.tutb button{font:inherit;font-size:14px;border-radius:10px;padding:6px 12px;border:1px solid var(--line);background:var(--paper);color:var(--ink)}
#tutNext{background:var(--accent);color:var(--onAccent);border-color:var(--accent)}
.tool{font:inherit;font-size:13px;color:var(--ink)}
.lotrow{display:flex;gap:10px;align-items:center;width:100%;text-align:left;background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:8px 10px;margin-bottom:8px}
.lr{display:flex;flex-direction:column;min-width:0}
.friend{display:flex;align-items:center;gap:6px;padding:8px 0;border-bottom:1px solid var(--line)}
.friend b{flex:1}
#chat,.chatbox{max-height:50vh;overflow-y:auto;background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:8px}
.msg{margin:6px 0;padding:6px 10px;background:var(--chip);border-radius:12px;max-width:85%;width:fit-content;word-break:break-word}
.msg.me{margin-left:auto;background:var(--accent);color:var(--onAccent)}
.msg .who{display:block;font-size:12px;opacity:.75}
.chatbar{display:flex;gap:6px;margin-top:8px}
.chatbar input{flex:1;font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--paper);color:var(--ink);min-width:0}
.mini.big{padding:6px 14px;font-size:15px}

body.game{overflow:hidden;position:fixed;inset:0;touch-action:none;overscroll-behavior:none}
#scene{position:fixed;inset:0;width:100vw;height:100vh;height:100dvh;display:block;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.hudTop{position:fixed;left:10px;top:calc(8px + env(safe-area-inset-top,0px));z-index:10;display:flex;flex-direction:column;gap:4px;align-items:flex-start;pointer-events:none}
.sceneName{background:var(--paper);border:1px solid var(--line);border-radius:999px;padding:2px 12px;font-size:13px;font-weight:500}
.hudTop .sync{text-align:left;background:var(--paper);border-radius:8px;padding:0 6px;opacity:.9}
.hudTop .sync:empty{display:none}
#iconbar{position:fixed;right:8px;top:calc(8px + env(safe-area-inset-top,0px));z-index:10;display:flex;flex-direction:column;gap:6px}
#iconbar button{width:54px;height:52px;border-radius:14px;border:1px solid var(--line);background:var(--paper);color:var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;font:inherit;font-size:11px;line-height:1.2;position:relative;padding:2px;box-shadow:0 1px 4px rgba(0,0,0,.14)}
#iconbar button[hidden]{display:none}
#iconbar svg{width:24px;height:24px;margin-bottom:1px}

#ringBtn .sbi{height:38px;margin:-6px 0 0;filter:drop-shadow(0 2px 1px rgba(0,0,0,.3))}

/* ===== 93（16u）精靈 ===== */
.fybob{animation:fybob 2.8s ease-in-out infinite}
@keyframes fybob{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-2.6px) rotate(2deg)}}
.fyglow{animation:fyglow 2.4s ease-in-out infinite}@keyframes fyglow{0%,100%{opacity:.25}50%{opacity:.6}}
.fyhalo{animation:fyhalo 2s ease-in-out infinite}@keyframes fyhalo{0%,100%{opacity:.55}50%{opacity:1}}
.fysp{animation:fysp 1.8s linear infinite}@keyframes fysp{0%{opacity:0;transform:translate(0,0)}20%{opacity:1}100%{opacity:0;transform:translate(0,9px)}}
@media (prefers-reduced-motion:reduce){.fybob,.fyglow,.fyhalo,.fysp{animation:none}}
.fysil{height:96px;width:auto;filter:brightness(0);opacity:.2}
.fyrow{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:8px;margin:6px 0;border-radius:14px;background:#FBF6EA;border:2px solid #E8DCC2}
.fyrow .fysil{height:72px}.fyth{display:flex;justify-content:center;min-width:44px}
.fyrc{display:flex;flex-direction:column;gap:1px;min-width:0}.fyrc b{font:16px var(--uifont,inherit)}
.fyrb{display:flex;flex-direction:column;gap:4px}.fyrb .btn{margin:0;white-space:nowrap}
.fygrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}
.fycell{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 4px;border-radius:14px;background:#F4EEE2;border:2px solid #E2D6BE;text-align:center}
.fycell b{font:14px var(--uifont,inherit)}.fycell small{font-size:11px;color:#8A7A66}
.fycell.on{background:linear-gradient(180deg,#FFF9EC,#F4EAFF);border-color:#C9A6E8}.fycell.evo{border-color:#E2B24A}
.fycb{all:unset;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
.fycell .btn{margin:4px 0 0;padding:4px 10px;min-height:30px}
.fybig{display:flex;justify-content:center;padding:6px 0;background:radial-gradient(circle at 50% 55%,#FFF6D6 0,#F6EEFF 55%,transparent 72%)}
.fynm{display:flex;gap:6px;align-items:center}.fynm input{flex:1}.fynm .btn{margin:0;width:auto}
#dexFilter[hidden]{display:none}/* 93：圖鑑的作物篩選列只在「品種圖鑑」分頁出現（以前 .filters 的 display 蓋過 hidden） */
.cel-fruit>svg.fyart{filter:drop-shadow(0 6px 10px rgba(80,50,10,.28))}

/* ===== 16v 收成回饋 ===== */
.pf.fl2{width:28px;height:28px;filter:drop-shadow(0 3px 3px rgba(60,30,0,.3))}.pf.fl2 svg{width:28px;height:28px}
.pf.fcoin{width:24px;height:24px;background:url(assets/icons/s/coin.png) center/contain no-repeat;filter:drop-shadow(0 2px 2px rgba(0,0,0,.3))}
.pf.hdot{width:7px;height:7px;border-radius:50%;animation:hburst .7s cubic-bezier(.2,.8,.3,1) forwards}
.pf.hleaf{width:11px;height:6px;border-radius:50% 0 50% 0;background:#6DBF45;animation:hburst .7s cubic-bezier(.2,.8,.3,1) forwards}
@keyframes hburst{0%{opacity:1;transform:translate(-50%,-50%) rotate(var(--r)) scale(.6)}70%{opacity:1}100%{opacity:0;transform:translate(-50%,-50%) translate(var(--dx),var(--dy)) rotate(calc(var(--r) + 180deg)) scale(1)}}
.pf.hring{width:20px;height:20px;border-radius:50%;border:3px solid #FFF3B0;animation:hring .55s ease-out forwards}
@keyframes hring{0%{opacity:.9;transform:translate(-50%,-50%) scale(.4)}100%{opacity:0;transform:translate(-50%,-50%) scale(3.2)}}
.pf.gain{background:none;border:0;padding:0;font:20px var(--uifont,inherit);color:#fff;text-shadow:0 2px 0 #55300F,1.5px 0 0 #55300F,-1.5px 0 0 #55300F,0 -1px 0 #55300F,0 4px 6px rgba(0,0,0,.25)}
.bump{animation:uibump .4s cubic-bezier(.3,1.8,.5,1)}
@keyframes uibump{0%{transform:scale(1)}40%{transform:scale(1.18)}100%{transform:scale(1)}}
@media (prefers-reduced-motion:reduce){.bump{animation:none}}

/* ===== 16w 介面改版第三步：面板（木框＋紙張、緞帶標題、紅色關閉鈕、立體按鈕、卡片、植株大圖的光座）。只改外觀，不動排版 ===== */
:root{--paperbg:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='p'><feTurbulence type='fractalNoise' baseFrequency='.75' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .55 0 0 0 0 .4 0 0 0 0 .2 0 0 0 .07 0'/></filter><rect width='100%' height='100%' filter='url(%23p)'/></svg>"),linear-gradient(180deg,#FFFBF0,#FFF3DA)}
#sheet{background:var(--paperbg);border:0;box-shadow:0 0 0 5px var(--w1),0 0 0 7px var(--w3),0 -8px 24px rgba(0,0,0,.35)}
.panel{background:var(--paperbg);border:0;box-shadow:0 0 0 5px var(--w1),0 0 0 7px var(--w3),0 -8px 24px rgba(0,0,0,.35)}
.ph{background:var(--uiwood);border-bottom:0;box-shadow:inset 0 2px 0 rgba(255,220,170,.4),0 3px 0 var(--w3);border-radius:16px 16px 0 0}
.ph h2{font:20px var(--uifont);color:#fff;text-shadow:var(--uistroke)}
.grip{background:#C9A77A;height:5px;width:44px}
.xbtn{border:0;color:#fff;font:700 18px var(--uifont);background:radial-gradient(circle at 38% 30%,#FF9C86,#E0462E 60%,#B32E1C);box-shadow:inset 0 2px 0 rgba(255,255,255,.4),0 0 0 3px #fff,0 0 0 5px #8E2A1A,0 4px 0 2px #6E1F13;text-shadow:0 1px 0 #8E2A1A}
.xbtn:active{transform:translateY(2px) scale(.96)}
#sheetBody>h2:first-child,#sheetBody>.lot-top:first-child h2{display:inline-block;font:19px var(--uifont);color:#fff;padding:5px 22px 7px;margin:2px 0 12px;background:linear-gradient(180deg,#8EDB5A,#4E9F2C);text-shadow:0 2px 0 #2F6E17,1px 0 0 #2F6E17,-1px 0 0 #2F6E17;clip-path:polygon(0 0,100% 0,calc(100% - 10px) 50%,100% 100%,0 100%,10px 50%);box-shadow:inset 0 2px 0 rgba(255,255,255,.35)}
#sheet h2,.panel h2{font-family:var(--uifont)}
#sheet h3,.panel h3{font-family:var(--uifont);font-weight:400;color:#6A3E14}
.btn{font-family:var(--uifont);font-weight:400;font-size:15px;border:0;color:#6A3E14;background:linear-gradient(180deg,#FFFDF6,#F4E4C2);box-shadow:inset 0 2px 0 #fff,inset 0 0 0 2px #D9BE8C,0 4px 0 #B88B52,0 6px 8px rgba(90,52,22,.18)}
.btn:active{transform:translateY(3px);box-shadow:inset 0 2px 0 #fff,inset 0 0 0 2px #D9BE8C,0 1px 0 #B88B52}
.btn.primary{color:#fff;background:linear-gradient(180deg,#8EDB5A,#4E9F2C);text-shadow:0 1.5px 0 #2F6E17,1px 0 0 #2F6E17,-1px 0 0 #2F6E17;box-shadow:inset 0 2px 0 rgba(255,255,255,.45),inset 0 0 0 2px #3E8A22,0 4px 0 #2B5E14,0 6px 8px rgba(30,70,10,.25)}
.btn.primary:active{box-shadow:inset 0 2px 0 rgba(255,255,255,.45),inset 0 0 0 2px #3E8A22,0 1px 0 #2B5E14}
.btn.warn{color:#B23A1E}
.btn:disabled{opacity:.55;filter:grayscale(.4)}
.chip{font-family:var(--uifont);background:#FFF6E0;border:1.5px solid #E2C796;color:#6A3E14}
.badge{font-family:var(--uifont)}
.fchip{font-family:var(--uifont);font-weight:400;border:0;background:#FFFDF6;box-shadow:inset 0 0 0 2px #E2C796,0 2px 0 #D2B47E}
.fchip[aria-pressed="true"]{background:linear-gradient(180deg,#8EDB5A,#4E9F2C);color:#fff;box-shadow:inset 0 0 0 2px #3E8A22,0 2px 0 #2B5E14;text-shadow:0 1px 0 #2F6E17}
.lot,.lotrow,.pick{border:0;background:#FFFEF9;box-shadow:inset 0 0 0 2px #EAD7B0,0 3px 0 #E0C99A;border-radius:14px}
.regbox{background:#FFF4DA;box-shadow:inset 0 0 0 2px #EED9AE;border-radius:14px}
.note{color:#7A6650}
.bar{background:#EADBB8;box-shadow:inset 0 2px 2px rgba(90,52,22,.18);height:10px}
.bar>i{background:linear-gradient(180deg,#B7EE7E,#5DBB3A);box-shadow:inset 0 2px 0 rgba(255,255,255,.45)}
.hero{position:relative;padding:18px 0 22px;margin:4px -6px 6px;border-radius:18px;background:radial-gradient(ellipse at 50% 46%,#FFF6CC 0,rgba(255,240,190,.55) 34%,rgba(255,240,190,0) 62%)}
.hero::before{content:"";position:absolute;left:50%;top:46%;width:230px;height:230px;transform:translate(-50%,-50%);background:repeating-conic-gradient(from 0deg,rgba(255,226,122,.22) 0 10deg,rgba(255,226,122,0) 10deg 22deg);-webkit-mask:radial-gradient(circle,#000 25%,transparent 66%);mask:radial-gradient(circle,#000 25%,transparent 66%);animation:herorot 24s linear infinite;pointer-events:none}
.hero::after{content:"";position:absolute;left:50%;bottom:12px;width:120px;height:20px;transform:translateX(-50%);border-radius:50%;background:radial-gradient(ellipse,rgba(120,80,30,.28),rgba(120,80,30,0) 70%);pointer-events:none}
.hero>*{position:relative;z-index:1}
#sheet input:not([type=checkbox]):not([type=radio]),#sheet select,#sheet textarea,.panel input:not([type=checkbox]):not([type=radio]),.panel select,.panel textarea{border:2px solid #E2C796;border-radius:10px;background:#FFFEF9;color:#4A3020;box-shadow:inset 0 2px 2px rgba(90,52,22,.08)}
#sheet input:focus,#sheet select:focus,.panel input:focus,.panel select:focus{outline:none;border-color:#7DC24E;box-shadow:0 0 0 3px rgba(125,194,78,.25)}
@keyframes herorot{to{transform:translate(-50%,-50%) rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.hero::before{animation:none}}

/* ===== 16x 介面改版第四步：剩下的 9 處（模式工具列、圓盤、提示、地圖按鈕與面板、教學、種子袋格子、探索提示與地名、裝飾小選單、讀取與登入畫面） ===== */
:root{--btn3d:inset 0 2px 0 #fff,inset 0 0 0 2px #D9BE8C,0 4px 0 #B88B52,0 6px 8px rgba(90,52,22,.18);--btn3dg:inset 0 2px 0 rgba(255,255,255,.45),inset 0 0 0 2px #3E8A22,0 4px 0 #2B5E14,0 6px 8px rgba(30,70,10,.25);--woodframe:0 0 0 4px var(--w1),0 0 0 6px var(--w3),0 6px 14px rgba(0,0,0,.3)}
/* 1 模式工具列 */
#shovelBar,#sowBar,#accelBar,#decoBar,#pickBar,#buildBar{background:var(--paperbg);border:0;border-radius:16px;box-shadow:var(--woodframe);left:12px;right:12px}
#shovelBar .bbtip,#sowBar .bbtip,#accelBar .bbtip,#decoBar .bbtip,#pickBar .bbtip,#buildBar .bbtip{color:#6A3E14}
#shovelBar .bbtip b,#sowBar .bbtip b,#accelBar .bbtip b,#decoBar .bbtip b,#pickBar .bbtip b,#buildBar .bbtip b{font-family:var(--uifont);font-weight:400}
#shovelBar button,#sowBar button,#accelBar button,#decoBar button,#pickBar button,#buildBar button{border:0;font:15px var(--uifont);color:#6A3E14;background:linear-gradient(180deg,#FFFDF6,#F4E4C2);box-shadow:var(--btn3d)}
#shovelBar button:active,#sowBar button:active,#accelBar button:active,#decoBar button:active,#pickBar button:active,#buildBar button:active{transform:translateY(3px);box-shadow:inset 0 2px 0 #fff,inset 0 0 0 2px #D9BE8C,0 1px 0 #B88B52}
#shovelBar button.done,#sowBar button.done,#accelBar button.done,#decoBar button.done,#pickBar button.done,#buildBar button.done,#buildBar button[aria-pressed="true"]{color:#fff;background:linear-gradient(180deg,#8EDB5A,#4E9F2C);text-shadow:0 1.5px 0 #2F6E17,1px 0 0 #2F6E17,-1px 0 0 #2F6E17;box-shadow:var(--btn3dg)}
/* 2 圓盤 */
#ringOv{background:radial-gradient(circle at 85% 90%,rgba(40,25,10,.15),rgba(40,25,10,.45))}
#ringMenu .ri{border:0;color:#6A3E14;font-family:var(--uifont)!important;font-weight:400;background:radial-gradient(circle at 38% 30%,#FFFDF4 0,#F7E9C8 55%,#E6CE9C 100%);box-shadow:inset 0 -3px 0 rgba(140,90,40,.25),0 0 0 3px var(--w1),0 0 0 5px var(--w3),0 4px 0 2px var(--w3),0 6px 10px rgba(0,0,0,.3)}
#ringMenu .ri img{width:30px!important;height:30px!important}
#ringMenu .ri span{font:12px var(--uifont);color:#6A3E14;line-height:1}
#ringMenu .ri.off{background:radial-gradient(circle at 38% 30%,#F2EEE6,#D8D2C6);box-shadow:0 0 0 3px #A89C8C,0 0 0 5px #6E655A,0 4px 0 2px #6E655A}
#ringMenu .ri.off span{color:#8A8378}
#ringMenu .ri.hl{background:radial-gradient(circle at 38% 30%,#FFF6C2,#FFD54A);box-shadow:0 0 0 4px #F2C14E,0 0 0 6px var(--w3),0 0 18px 6px rgba(255,213,74,.7)}
/* 3 提示 */
#toast{background:var(--uiwood);color:#fff;font:15px var(--uifont);padding:9px 18px 10px;border-radius:14px;text-shadow:0 1.5px 0 var(--w3);box-shadow:inset 0 2px 0 rgba(255,220,170,.4),0 3px 0 var(--w3),0 6px 12px rgba(0,0,0,.3);max-width:calc(100vw - 40px);text-align:center}
/* 4 地圖按鈕與地圖面板 */
#mapBtn{width:52px;height:52px;padding:0;border:0;border-radius:50%;right:12px;color:#fff;font:12px var(--uifont);background:radial-gradient(circle at 38% 30%,#FFFDF4 0,#F7E9C8 55%,#E6CE9C 100%);box-shadow:inset 0 -3px 0 rgba(140,90,40,.25),0 0 0 4px var(--w1),0 0 0 6px var(--w3),0 5px 0 2px var(--w3),0 7px 10px rgba(0,0,0,.3);display:flex;align-items:center;justify-content:center}
#mapBtn .ibimg{width:36px;height:36px;margin:0}
#mapBtn>span{position:absolute;left:50%;bottom:-19px;transform:translateX(-50%);white-space:nowrap;font:12.5px var(--uifont);color:#fff;text-shadow:var(--uistroke)}
#mapBtn:active{transform:translateY(3px) scale(.96)}
#mapPanel{background:var(--paperbg);border:0;border-radius:16px;box-shadow:var(--woodframe);right:14px}
#mapPanel h2,#mapPanel h3,#mapPanel b{font-family:var(--uifont);font-weight:400;color:#6A3E14}
#mapPanel button{font-family:var(--uifont)}
/* 5 教學 */
#tut{background:var(--paperbg);border:0;border-radius:16px;box-shadow:var(--woodframe);left:14px}
.tuth{font-family:var(--uifont);font-weight:400;color:#6A3E14;font-size:16px}
.tuth .gp{border:3px solid #F2C14E;box-shadow:0 0 0 2px var(--w3)}
#tutText{color:#4A3020}
.tutb button{border:0;font:14px var(--uifont);color:#6A3E14;padding:7px 14px;background:linear-gradient(180deg,#FFFDF6,#F4E4C2);box-shadow:var(--btn3d)}
.tutb button:active{transform:translateY(3px)}
#tutNext{color:#fff;background:linear-gradient(180deg,#8EDB5A,#4E9F2C);text-shadow:0 1.5px 0 #2F6E17;box-shadow:var(--btn3dg)}
/* 6 種子袋格子 */
.slots{background:var(--uiwood);border:0;border-radius:14px;padding:6px;box-shadow:inset 0 2px 0 rgba(255,220,170,.35),0 3px 0 var(--w3)}
.slot{border:0;border-radius:10px;background:radial-gradient(circle at 50% 40%,#FFFDF4,#F6E7C4);box-shadow:inset 0 -2px 0 rgba(140,90,40,.18),inset 0 0 0 1.5px #D9BE8C}
.slot.my{background:radial-gradient(circle at 50% 40%,#FFFFF8,#EEF7DD);box-shadow:inset 0 -2px 0 rgba(60,110,30,.18),inset 0 0 0 2px #7DC24E}
.slot.empty{opacity:1;background:rgba(255,246,222,.35);box-shadow:inset 0 2px 3px rgba(60,30,5,.3)}
